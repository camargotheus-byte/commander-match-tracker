<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commander Match Tracker — Retro Edition 2026</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style id="cmt-base-style">
    * { box-sizing: border-box; }
    body {
      background-color: #F8EFD5;
      color: #1E1A16;
      margin: 0;
      padding: 0;
      background-image: radial-gradient(rgba(30, 26, 22, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Neo-Brutalist Core Primitives (Retro @BackToColor Palette) */
    .nb-card {
      background-color: #FFFDF7;
      border: 2px solid #1E1A16;
      border-radius: 16px;
      box-shadow: 4px 4px 0 #1E1A16;
    }
    .nb-card-sm {
      background-color: #FFFDF7;
      border: 2px solid #1E1A16;
      border-radius: 12px;
      box-shadow: 3px 3px 0 #1E1A16;
    }
    .nb-subtle {
      background-color: #F8EFD5;
      border: 2px solid #1E1A16;
      border-radius: 12px;
    }

    /* Iconic Folder Card */
    .nb-folder {
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.12s ease;
    }
    .nb-folder-clickable {
      cursor: pointer;
    }
    .nb-folder-clickable:hover {
      transform: translate(-2px, -2px);
    }
    .nb-folder-clickable:hover .nb-folder-body {
      box-shadow: 6px 6px 0 #1E1A16;
    }
    .nb-folder-clickable:active {
      transform: translate(2px, 2px);
    }
    .nb-folder-clickable:active .nb-folder-body {
      box-shadow: 2px 2px 0 #1E1A16;
    }
    .nb-folder-tab {
      width: 46%;
      max-width: 108px;
      min-width: 56px;
      height: 11px;
      border: 2px solid #1E1A16;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      margin-left: 8px;
      position: relative;
      z-index: 2;
    }
    .nb-folder-body {
      background-color: #FFFDF7;
      border: 2px solid #1E1A16;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #1E1A16;
      margin-top: -2px;
      position: relative;
      z-index: 1;
      transition: box-shadow 0.12s ease;
      flex: 1;
    }
    .nb-icon-box {
      width: 40px;
      height: 40px;
      border: 2px solid #1E1A16;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #1E1A16;
    }

    /* Tactile Buttons & Pills */
    .nb-btn {
      border: 2px solid #1E1A16;
      border-radius: 12px;
      box-shadow: 3px 3px 0 #1E1A16;
      background-color: #FFFDF7;
      color: #1E1A16;
      font-weight: 700;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
      cursor: pointer;
    }
    .nb-btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #1E1A16;
    }
    .nb-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #1E1A16;
    }
    .nb-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: 1px 1px 0 #1E1A16;
    }
    .nb-btn-yellow {
      background-color: #F0BE57 !important;
      color: #1E1A16 !important;
    }
    .nb-btn-green {
      background-color: #82AAC7 !important;
      color: #1E1A16 !important;
    }
    .nb-btn-pink {
      background-color: #C03A22 !important;
      color: #F8EFD5 !important;
    }
    .nb-btn-purple {
      background-color: #D58A4B !important;
      color: #1E1A16 !important;
    }
    .nb-btn-black {
      background-color: #1E1A16 !important;
      color: #F8EFD5 !important;
    }

    .nb-pill {
      border: 2px solid #1E1A16;
      border-radius: 10px;
      background-color: #FFFDF7;
      color: #1E1A16;
      font-weight: 700;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
      cursor: pointer;
    }
    .nb-pill:hover {
      background-color: #F8EFD5;
    }
    .nb-pill-active {
      background-color: #F0BE57 !important;
      color: #1E1A16 !important;
      box-shadow: 2px 2px 0 #1E1A16;
    }

    /* Retro Badges */
    .badge-win {
      background-color: #82AAC7;
      color: #1E1A16;
      border: 1.5px solid #1E1A16;
      font-weight: 800;
    }
    .badge-loss {
      background-color: #C03A22;
      color: #F8EFD5;
      border: 1.5px solid #1E1A16;
      font-weight: 800;
    }
    .badge-draw {
      background-color: #F0BE57;
      color: #1E1A16;
      border: 1.5px solid #1E1A16;
      font-weight: 800;
    }
    .badge-neutral {
      background-color: #F8EFD5;
      color: #1E1A16;
      border: 1.5px solid #1E1A16;
      font-weight: 700;
    }
    .badge-pop-pink {
      background-color: #C03A22;
      color: #F8EFD5;
      border: 1.5px solid #1E1A16;
      font-weight: 800;
    }
    .badge-pop-purple {
      background-color: #D58A4B;
      color: #1E1A16;
      border: 1.5px solid #1E1A16;
      font-weight: 800;
    }
    .badge-pop-yellow {
      background-color: #F0BE57;
      color: #1E1A16;
      border: 1.5px solid #1E1A16;
      font-weight: 800;
    }

    /* Form Controls */
    select, input[type="text"], input[type="search"], textarea {
      background-color: #FFFDF7;
      color: #1E1A16;
      border: 2px solid #1E1A16;
      border-radius: 10px;
      font-weight: 500;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      box-shadow: 3px 3px 0 #F0BE57;
    }

    .text-muted { color: #5C5248; }
    .wr-high { color: #2B628A; }
    .wr-mid { color: #A65E22; }
    .wr-low { color: #C03A22; }

    #tooltip {
      pointer-events: none;
      position: fixed;
      z-index: 70;
      background-color: #FFFDF7;
      color: #1E1A16;
      border: 2px solid #1E1A16;
      border-radius: 12px;
      box-shadow: 4px 4px 0 #1E1A16;
    }

    .interactive-row { transition: background-color 0.1s ease; }
    .interactive-row:hover { background-color: #F8EFD5; }

    .scroll-thin::-webkit-scrollbar { height: 7px; width: 7px; }
    .scroll-thin::-webkit-scrollbar-thumb {
      background-color: #1E1A16;
      border-radius: 9999px;
    }
    .scroll-thin::-webkit-scrollbar-track {
      background-color: #F8EFD5;
      border-radius: 9999px;
    }

    @keyframes xrayPop {
      0% { box-shadow: 0 0 0 4px #F0BE57, 4px 4px 0 #1E1A16; }
      100% { box-shadow: 4px 4px 0 #1E1A16; }
    }
    .xray-flash {
      animation: xrayPop 0.65s ease-out;
    }
    #deck-xray, #rival-xray {
      scroll-margin-top: 16px;
    }
  </style>
</head>
<body class="antialiased min-h-screen">
  <!-- Floating Neo-Brutalist Tooltip -->
  <div id="tooltip" class="hidden px-3 py-2 text-xs max-w-xs leading-relaxed"></div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 nb-card-sm px-4 py-2.5 text-xs font-extrabold flex items-center gap-2"></div>

  <!-- Decorative Retro Accent Bar (@BackToColor) -->
  <div class="w-full h-2.5 flex border-b-2 border-[#1E1A16]">
    <div class="flex-1 bg-[#C03A22]"></div>
    <div class="flex-1 bg-[#D58A4B]"></div>
    <div class="flex-1 bg-[#F0BE57]"></div>
    <div class="flex-1 bg-[#82AAC7]"></div>
    <div class="flex-1 bg-[#F8EFD5]"></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 space-y-5">
    <!-- Top Header + Navigation (Reference-inspired) -->
    <header class="space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <!-- Brand & Punchy Title -->
        <div class="flex items-start gap-3">
          <div class="nb-icon-box bg-[#F0BE57] shadow-[3px_3px_0_#1E1A16] mt-0.5" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <span class="px-2 py-0.5 rounded-md text-xs badge-pop-purple">MTG COMMANDER · 2026</span>
              <span id="header-scope" class="text-xs font-semibold text-muted">
                Janeiro – Novembro 2026 · 212 partidas registradas
              </span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight leading-none mt-1.5 text-[#1E1A16]">
              Track now. Win anytime.
            </h1>
          </div>
        </div>

        <!-- Tactile Navigation Buttons -->
        <nav class="flex items-center gap-2 flex-wrap" role="tablist" aria-label="Seções do painel">
          <button class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tab="overview" role="tab" aria-selected="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Visão Geral</span>
          </button>
          <button class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tab="decks" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Decks</span>
          </button>
          <button class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tab="opponents" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Oponentes</span>
          </button>
          <button class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tab="history" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Histórico</span>
          </button>
          <button class="nb-btn nb-btn-yellow px-3.5 py-2 text-xs inline-flex items-center gap-1.5" data-tab="report" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Reportar</span>
            <span id="pending-tab-badge" class="hidden px-1.5 py-0.2 rounded-md text-xs badge-pop-pink">0</span>
          </button>
          <button id="btn-download-html" type="button" class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tip="Baixa uma cópia completa deste painel (.html) para salvar e abrir localmente no seu navegador, preservando seus favoritos e ícones/cores personalizados.">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Baixar HTML</span>
          </button>
        </nav>
      </div>

      <!-- Signature Quick-Action Bar (inspired by "# Paste link to save" + Yellow "+" button) -->
      <div id="global-filter-bar" class="space-y-2.5">
        <div class="flex items-stretch gap-2.5">
          <div class="flex-1 nb-card-sm flex items-center px-3 gap-2">
            <span class="font-black text-base text-[#1E1A16] select-none">#</span>
            <input id="quick-search" type="search" placeholder="Busca rápida: digite um deck, jogador, comandante ou CMD-212..." class="w-full py-2.5 text-xs bg-transparent !border-0 !shadow-none focus:!shadow-none" />
            <button id="btn-toggle-fav-filter" class="px-2.5 py-1 rounded-lg text-xs font-bold border-2 border-[#1E1A16] bg-[#F8EFD5] hover:bg-[#F0BE57] cursor-pointer shrink-0 inline-flex items-center gap-1" title="Filtrar apenas decks favoritados">
              <span id="fav-filter-star">★</span>
              <span class="hidden sm:inline">Favoritos</span>
              <span id="fav-count-badge" class="tabular-nums">(0)</span>
            </button>
            <button id="btn-toggle-filters" class="px-2.5 py-1 rounded-lg text-xs font-bold border-2 border-[#1E1A16] bg-[#F8EFD5] hover:bg-[#F0BE57] cursor-pointer shrink-0 inline-flex items-center gap-1">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1E1A16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <span>Filtros</span>
            </button>
          </div>
          <button data-tab="report" title="Reportar nova partida" class="nb-btn nb-btn-yellow w-12 shrink-0 flex items-center justify-center text-xl font-black" aria-label="Reportar nova partida">
            +
          </button>
        </div>

        <!-- Collapsible Structured Filters Strip -->
        <section id="filters-drawer" class="nb-card-sm p-3.5 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5 items-end">
            <div>
              <label for="f-month" class="block text-xs font-extrabold mb-1">Mês</label>
              <select id="f-month" class="w-full px-2.5 py-1.5 text-xs"></select>
            </div>
            <div>
              <label for="f-deck" class="block text-xs font-extrabold mb-1">Meu Deck</label>
              <select id="f-deck" class="w-full px-2.5 py-1.5 text-xs"></select>
            </div>
            <div>
              <label for="f-player" class="block text-xs font-extrabold mb-1">Oponente (Jogador)</label>
              <select id="f-player" class="w-full px-2.5 py-1.5 text-xs"></select>
            </div>
            <div>
              <span class="block text-xs font-extrabold mb-1">Tamanho da Mesa</span>
              <div id="f-pod-group" class="grid grid-cols-4 gap-1">
                <button data-pod="all" class="pod-pill nb-pill px-2 py-1.5 text-xs nb-pill-active">Todas</button>
                <button data-pod="2" class="pod-pill nb-pill px-2 py-1.5 text-xs">1v1</button>
                <button data-pod="3" class="pod-pill nb-pill px-2 py-1.5 text-xs">3P</button>
                <button data-pod="4+" class="pod-pill nb-pill px-2 py-1.5 text-xs">4+P</button>
              </div>
            </div>
            <div>
              <span class="block text-xs font-extrabold mb-1">Origem do Deck</span>
              <div id="f-origin-group" class="grid grid-cols-3 gap-1">
                <button data-origin="all" class="origin-pill nb-pill px-2 py-1.5 text-xs nb-pill-active">Todos</button>
                <button data-origin="own" class="origin-pill nb-pill px-2 py-1.5 text-xs">Próprios</button>
                <button data-origin="borrowed" class="origin-pill nb-pill px-2 py-1.5 text-xs">Emprest.</button>
              </div>
            </div>
          </div>
          <div id="active-filters-bar" class="hidden flex items-center justify-between gap-2 pt-2.5 border-t-2 border-[#1E1A16] flex-wrap">
            <div id="active-filter-chips" class="flex items-center gap-1.5 flex-wrap text-xs"></div>
            <button id="btn-reset-filters" class="px-2.5 py-1 rounded-lg text-xs font-extrabold badge-loss cursor-pointer hover:opacity-90">
              Limpar filtros ×
            </button>
          </div>
        </section>
      </div>
    </header>

    <!-- KPI Folder Cards Strip -->
    <section id="kpi-strip" class="grid grid-cols-2 lg:grid-cols-5 gap-3.5"></section>

    <!-- Main View Container -->
    <main id="view-root" class="space-y-5"></main>
  </div>

    const BASE_MATCHES = RAW.rows.map(r => ({
      n: r[0],
      id: r[1],
      monthIdx: r[2],
      month: MONTHS[r[2]],
      deckIdx: r[3],
      deck: RAW.decks[r[3]],
      borrowed: RAW.decks[r[3]].toLowerCase().includes('(emprestado)'),

      pod: r[5],

      winnerPlayer: r[7] >= 0 ? RAW.players[r[7]] : '',
      enemyCmds: r[8].map(i => RAW.ecmds[i]),
      ordem: r[9],
      oppStr: r[10],
      note: r[11],
      pending: false
    }));

    const STORAGE_KEY = 'cmt_pending_reports_v1';
    function loadPendingMatches() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(arr)) return [];
        const syncedIds = new Set(BASE_MATCHES.map(m => m.id));
        const filtered = arr.filter(m => !syncedIds.has(m.id));
        if (filtered.length !== arr.length) localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
        return filtered;
      } catch (_) { return []; }
    }
    function savePendingMatches(arr) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch (_) {}
    }

    let pendingMatches = loadPendingMatches();
    let MATCHES = BASE_MATCHES.concat(pendingMatches);
    function rebuildMatches() { MATCHES = BASE_MATCHES.concat(pendingMatches); }
    function nextSuggestedId() { return 'CMD-' + String(MATCHES.length + 1).padStart(3, '0'); }

    const FAV_STORAGE_KEY = 'cmt_favorite_decks_v1';
    const DEFAULT_FAVORITES = /*CMT_FAVS_START*/[]/*CMT_FAVS_END*/;
    function loadFavoriteDecks() {
      try {
        const raw = localStorage.getItem(FAV_STORAGE_KEY);
        const arr = raw !== null ? JSON.parse(raw) : DEFAULT_FAVORITES;
        return new Set(Array.isArray(arr) ? arr : []);
      } catch (_) { return new Set(Array.isArray(DEFAULT_FAVORITES) ? DEFAULT_FAVORITES : []); }
    }
    function saveFavoriteDecks(set) {
      try { localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(Array.from(set))); } catch (_) {}
    }
    let favoriteDecks = loadFavoriteDecks();
    function isFavDeck(name) { return favoriteDecks.has(name); }
    function toggleFavoriteDeck(name) {
      if (favoriteDecks.has(name)) {
        favoriteDecks.delete(name);
        saveFavoriteDecks(favoriteDecks);
        showToast(`${shortDeck(name, 22)} removido dos favoritos.`);
      } else {
        favoriteDecks.add(name);
        saveFavoriteDecks(favoriteDecks);
        showToast(`★ ${shortDeck(name, 22)} adicionado aos favoritos!`);
      }
    }

    const DECK_STYLE_STORAGE_KEY = 'cmt_deck_styles_v1';
    const DEFAULT_DECK_STYLES = /*CMT_STYLES_START*/{}/*CMT_STYLES_END*/;
    function loadDeckStyles() {
      try {
        const raw = localStorage.getItem(DECK_STYLE_STORAGE_KEY);
        const obj = raw !== null ? JSON.parse(raw) : DEFAULT_DECK_STYLES;
        return obj && typeof obj === 'object' ? obj : {};
      } catch (_) { return DEFAULT_DECK_STYLES && typeof DEFAULT_DECK_STYLES === 'object' ? { ...DEFAULT_DECK_STYLES } : {}; }
    }
    function saveDeckStyles(obj) {
      try { localStorage.setItem(DECK_STYLE_STORAGE_KEY, JSON.stringify(obj)); } catch (_) {}
    }
    let deckStyles = loadDeckStyles();

    function autoDeckAccent(d) {
      if (d.borrowed) return { color: '#F8EFD5', ink: '#1E1A16', iconKey: 'folder', icon: ICONS.folder };
      if (d.wr === 1 && d.games >= 3) return { color: '#82AAC7', ink: '#1E1A16', iconKey: 'crown', icon: ICONS.crown };
      if (d.wr >= 0.7) return { color: '#82AAC7', ink: '#1E1A16', iconKey: 'bolt', icon: ICONS.bolt };
      if (d.wr >= 0.55) return { color: '#F0BE57', ink: '#1E1A16', iconKey: 'star', icon: ICONS.star };
      if (d.wr >= 0.45) return { color: '#D58A4B', ink: '#1E1A16', iconKey: 'book', icon: ICONS.book };
      return { color: '#C03A22', ink: '#F8EFD5', iconKey: 'heart', icon: ICONS.heart };
    }

    function deckAccent(d) {
      const base = autoDeckAccent(d);
      const custom = deckStyles[d.deck];
      if (!custom) return { ...base, customIcon: false, customColor: false };
      let color = base.color, ink = base.ink, customColor = false;
      if (custom.color) {
        const pal = PALETTE_OPTIONS.find(p => p.key === custom.color);
        if (pal) { color = pal.color; ink = pal.ink; customColor = true; }
      }
      let icon = base.icon, iconKey = base.iconKey, customIcon = false;
      if (custom.icon && ICONS[custom.icon]) {
        icon = ICONS[custom.icon];
        iconKey = custom.icon;
        customIcon = true;
      }
      return { color, ink, icon, iconKey, customIcon, customColor };
    }

    function getClassicDeckMap() {
      const counts = new Map();
      const firstSeen = new Map();
      for (const m of MATCHES) {
        if (m.borrowed) continue;
        counts.set(m.deck, (counts.get(m.deck) || 0) + 1);
        if (!firstSeen.has(m.deck)) firstSeen.set(m.deck, { n: m.n, id: m.id, month: m.month });
      }
      const qualified = Array.from(firstSeen.entries())
        .filter(([deck]) => (counts.get(deck) || 0) > 5)
        .sort((a, b) => a[1].n - b[1].n)
        .slice(0, 5);
      const result = new Map();
      qualified.forEach(([deck, info], idx) => {
        result.set(deck, { rank: idx + 1, id: info.id, month: info.month, totalGames: counts.get(deck) });
      });
      return result;
    }

    function getDeckCurrentWinStreak(deckName, matchesList) {
      let streak = 0;
      for (let i = matchesList.length - 1; i >= 0; i--) {
        if (matchesList[i].deck !== deckName) continue;
        if (matchesList[i].res === 'V') streak++;
        else break;
      }
      return streak;
    }

    function getDeckBadges(d, opts = {}) {
      const badges = [];
      const classicInfo = getClassicDeckMap().get(d.deck);
      const streak = getDeckCurrentWinStreak(d.deck, d.matches || MATCHES);

      if (d.borrowed) {
        badges.push({
          label: 'EMPREST.',
          cls: 'badge-neutral',
          tip: 'Deck emprestado utilizado em partidas registradas.'
        });
      }
      if (!d.borrowed && d.wr === 1 && d.games >= 3) {
        badges.push({
          label: 'INVICTO',
          cls: 'badge-win',
          tip: `100% de aproveitamento com 3 ou mais jogos (${d.w}V–0D).`
        });
      }
      if (!d.borrowed && d.wr >= 0.7 && d.games >= 10) {
        badges.push({
          label: 'TOP',
          cls: 'badge-pop-pink',
          tip: `Desempenho de elite: 70%+ de Win Rate com pelo menos 10 partidas (${fmtPct(d.wr)} em ${d.games} jogos).`
        });
      }
      if (streak >= 3) {
        badges.push({
          label: 'EM ALTA',
          cls: 'badge-pop-yellow',
          tip: `Em grande fase: ${streak} vitórias seguidas nas partidas mais recentes deste deck!`
        });
      }
      if (classicInfo) {
        badges.push({
          label: 'CLÁSSICO',
          cls: 'badge-pop-purple',
          tip: `Deck de assinatura (#${classicInfo.rank} entre os 5 mais antigos com mais de 5 jogos) — estreou na ${classicInfo.id} (${classicInfo.month}/2026).`
        });
      }
      if (opts.honorable && !d.borrowed) {
        badges.push({
          label: 'MENÇÃO',
          cls: 'badge-neutral',
          tip: 'Menos de 5 partidas registradas — amostra pequena (Menção Honrosa).'
        });
      }
      return badges;
    }

    function renderBadgesHtml(badges) {
      if (!badges.length) return '';
      return badges.map(b => `<span class="px-1.5 py-0.2 rounded text-xs ${b.cls}" data-tip="${esc(b.tip)}">${esc(b.label)}</span>`).join('');
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function fmtPct(v, decimals = 1) {
      return (v * 100).toFixed(decimals).replace('.', ',') + '%';
    }

    function shortDeck(name, maxLen = 28) {
      const clean = name.replace(/\s*\(emprestado\)/i, '');
      const main = clean.split(',')[0].split('//')[0].trim();
      if (clean.length <= maxLen) return clean;
      return main.length <= maxLen ? main : main.slice(0, maxLen - 1) + '…';
    }

    function wrClass(wr) {
      if (wr >= 0.55) return 'wr-high';
      if (wr >= 0.40) return 'wr-mid';
      return 'wr-low';
    }

    function wrBarColor(wr) {
      if (wr >= 0.55) return '#82AAC7';
      if (wr >= 0.40) return '#F0BE57';
      return '#C03A22';
    }

    function getFilteredMatches() {
      const q = state.quickSearch.trim().toLowerCase();
      return MATCHES.filter(m => {
        if (state.month !== 'all' && m.monthIdx !== Number(state.month)) return false;
        if (state.deck !== 'all' && m.deck !== state.deck) return false;
        if (state.player !== 'all' && !m.players.includes(state.player)) return false;
        if (state.pod === '2' && m.pod !== 2) return false;
        if (state.pod === '3' && m.pod !== 3) return false;
        if (state.pod === '4+' && m.pod < 4) return false;
        if (state.origin === 'own' && m.borrowed) return false;
        if (state.origin === 'borrowed' && !m.borrowed) return false;
        if (state.onlyFavorites && !favoriteDecks.has(m.deck)) return false;
        if (state.enemyCmdFilter && !m.enemyCmds.includes(state.enemyCmdFilter)) return false;
        if (q) {
          const hay = `${m.id} ${m.month} ${m.deck} ${m.oppStr} ${m.note}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function calcStats(list) {
      let w = 0, l = 0, d = 0, expSum = 0;
      let curWin = 0, bestWin = 0, curLoss = 0, worstLoss = 0;
      for (const m of list) {
        expSum += 1 / m.pod;
        if (m.res === 'V') {
          w++; curWin++; curLoss = 0;
          if (curWin > bestWin) bestWin = curWin;
        } else if (m.res === 'D') {
          l++; curLoss++; curWin = 0;
          if (curLoss > worstLoss) worstLoss = curLoss;
        } else {
          d++; curWin = 0; curLoss = 0;
        }
      }
      const total = list.length;
      const wr = total ? w / total : 0;
      const expWr = total ? expSum / total : 0;
      let currentStreakLabel = '—';
      let currentStreakType = 'neutral';
      if (total) {
        const last = list[list.length - 1];
        let cnt = 0;
        for (let i = list.length - 1; i >= 0 && list[i].res === last.res; i--) cnt++;
        if (last.res === 'V') { currentStreakLabel = `+${cnt}V seguidas`; currentStreakType = 'win'; }
        else if (last.res === 'D') { currentStreakLabel = `${cnt}D seguidas`; currentStreakType = 'loss'; }
        else { currentStreakLabel = 'Empate recente'; currentStreakType = 'draw'; }
      }
      return { total, w, l, d, wr, expWr, delta: wr - expWr, bestWin, worstLoss, currentStreakLabel, currentStreakType };
    }

    function wilsonScore(w, n, z = 1.645) {
      if (!n) return 0;
      const p = w / n;
      const denom = 1 + (z * z) / n;
      const center = p + (z * z) / (2 * n);
      const margin = z * Math.sqrt((p * (1 - p) + (z * z) / (4 * n)) / n);
      return Math.max(0, (center - margin) / denom);
    }

    function groupDecks(list) {
      const map = new Map();
      for (const m of list) {
        if (!map.has(m.deck)) {
          map.set(m.deck, { deck: m.deck, borrowed: m.borrowed, games: 0, w: 0, l: 0, d: 0, expSum: 0, matches: [] });
        }
        const g = map.get(m.deck);
        g.games++;
        g.expSum += 1 / m.pod;
        if (m.res === 'V') g.w++;
        else if (m.res === 'D') g.l++;
        else g.d++;
        g.matches.push(m);
      }
      return Array.from(map.values()).map(g => ({
        ...g,
        wr: g.games ? g.w / g.games : 0,
        expWr: g.games ? g.expSum / g.games : 0,
        wilson: wilsonScore(g.w, g.games),
        recent: g.matches.slice(-5).map(x => x.res)
      }));
    }

    function groupPlayers(list) {
      const map = new Map();
      for (const m of list) {
        for (const p of m.players) {
          if (!map.has(p)) {
            map.set(p, { player: p, games: 0, w: 0, l: 0, d: 0, oppWins: 0, expSum: 0 });
          }
          const g = map.get(p);
          g.games++;
          g.expSum += 1 / m.pod;
          if (m.res === 'V') g.w++;
          else if (m.res === 'D') g.l++;
          else g.d++;
          if (m.winnerPlayer === p) g.oppWins++;
        }
      }
      return Array.from(map.values()).map(g => ({
        ...g,
        wr: g.games ? g.w / g.games : 0,
        expWr: g.games ? g.expSum / g.games : 0
      }));
    }

    function groupEnemyCmds(list) {
      const map = new Map();
      for (const m of list) {
        const seen = new Set();
        for (const c of m.enemyCmds) {
          if (seen.has(c)) continue;
          seen.add(c);
          if (!map.has(c)) map.set(c, { cmd: c, games: 0, w: 0, l: 0, d: 0, players: new Set() });
          const g = map.get(c);
          g.games++;
          if (m.res === 'V') g.w++;
          else if (m.res === 'D') g.l++;
          else g.d++;
          m.players.forEach(p => g.players.add(p));
        }
      }
      return Array.from(map.values()).map(g => ({
        ...g,
        wr: g.games ? g.w / g.games : 0,
        playersList: Array.from(g.players)
      }));
    }

    // =========================================================================
    // TOOLTIP SYSTEM (1.5s hover delay on Desktop · Tap / 500ms Long-Press on Mobile)
    // =========================================================================
    const tooltipEl = document.getElementById('tooltip');
    const TIP_HOVER_DELAY_MS = 1500;
    const TIP_LONG_PRESS_MS = 500;
    const TIP_INTERACTIVE_SEL = 'button, a, input, select, [data-jump-deck], [data-jump-rival], [data-click-month], [data-click-pod], [data-filter-ecmd], [data-heatmap-deck], [data-select-deck], [data-select-player]';

    let tipTarget = null;
    let tipTimer = null;
    let tipVisible = false;
    let tipLastPos = { x: 0, y: 0 };
    let touchTimer = null;
    let touchStartPos = null;
    let lastTouchTime = 0;
    let suppressNextClick = false;

    function positionTooltipAt(x, y) {
      const pad = 12;
      const rect = tooltipEl.getBoundingClientRect();
      let left = x + pad;
      let top = y + pad;
      if (left + rect.width > window.innerWidth - 8) left = x - rect.width - pad;
      if (top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
      tooltipEl.style.left = Math.max(8, left) + 'px';
      tooltipEl.style.top = Math.max(8, top) + 'px';
    }

    function showTooltipAt(x, y, html) {
      tooltipEl.innerHTML = html;
      tooltipEl.classList.remove('hidden');
      tipVisible = true;
      positionTooltipAt(x, y);
    }

    function hideTooltip() {
      clearTimeout(tipTimer);
      clearTimeout(touchTimer);
      tipTimer = null;
      touchTimer = null;
      tipTarget = null;
      tipVisible = false;
      tooltipEl.classList.add('hidden');
    }

    // Universal normalizer: converts any native HTML title="..." into data-tip so
    // EVERY tooltip (existing or future) obeys the single 1.5s desktop / touch rule.
    function normalizeNativeTitles(rootEl = document) {
      rootEl.querySelectorAll('[title]').forEach(el => {
        const t = el.getAttribute('title');
        el.removeAttribute('title');
        if (t && !el.hasAttribute('data-tip')) {
          el.setAttribute('data-tip', esc(t));
        }
      });
    }

    function resolveTipTarget(node) {
      if (!node || !node.closest) return null;
      const el = node.closest('[data-tip], [title]');
      if (!el) return null;
      if (el.hasAttribute('title')) {
        const t = el.getAttribute('title');
        el.removeAttribute('title');
        if (t && !el.hasAttribute('data-tip')) el.setAttribute('data-tip', esc(t));
      }
      return el.hasAttribute('data-tip') ? el : null;
    }

    // Desktop hover with universal 1.5s delay
    document.addEventListener('mousemove', e => {
      if (Date.now() - lastTouchTime < 800) return;
      const target = resolveTipTarget(e.target);
      if (!target) {
        if (tipTarget || tipVisible) hideTooltip();
        return;
      }
      tipLastPos = { x: e.clientX, y: e.clientY };
      if (target !== tipTarget) {
        clearTimeout(tipTimer);
        tooltipEl.classList.add('hidden');
        tipVisible = false;
        tipTarget = target;
        tipTimer = setTimeout(() => {
          if (tipTarget === target && document.contains(target)) {
            showTooltipAt(tipLastPos.x, tipLastPos.y, target.getAttribute('data-tip'));
          }
        }, TIP_HOVER_DELAY_MS);
      } else if (tipVisible) {
        positionTooltipAt(e.clientX, e.clientY);
      }
    });

    document.addEventListener('mouseleave', hideTooltip);
    document.addEventListener('mousedown', hideTooltip);
    window.addEventListener('scroll', hideTooltip, true);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTooltip(); });

    // Mobile touch: tap on info-only cards, 500ms long-press on clickable controls
    document.addEventListener('touchstart', e => {
      lastTouchTime = Date.now();
      clearTimeout(touchTimer);
      const t = e.touches[0];
      touchStartPos = { x: t.clientX, y: t.clientY };
      const target = resolveTipTarget(e.target);
      if (!target) {
        if (tipVisible) hideTooltip();
        return;
      }
      const isInteractive = Boolean(target.closest(TIP_INTERACTIVE_SEL));
      if (!isInteractive) {
        if (tipVisible && tipTarget === target) {
          hideTooltip();
        } else {
          hideTooltip();
          tipTarget = target;
          showTooltipAt(t.clientX, t.clientY, target.getAttribute('data-tip'));
        }
      } else {
        touchTimer = setTimeout(() => {
          tipTarget = target;
          suppressNextClick = true;
          showTooltipAt(touchStartPos.x, touchStartPos.y, target.getAttribute('data-tip'));
        }, TIP_LONG_PRESS_MS);
      }
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (!touchStartPos) return;
      const t = e.touches[0];
      if (Math.hypot(t.clientX - touchStartPos.x, t.clientY - touchStartPos.y) > 10) {
        clearTimeout(touchTimer);
        touchTimer = null;
      }
    }, { passive: true });

    document.addEventListener('touchend', () => {
      lastTouchTime = Date.now();
      clearTimeout(touchTimer);
      touchTimer = null;
    }, { passive: true });

    document.addEventListener('click', e => {
      if (suppressNextClick) {
        suppressNextClick = false;
        e.preventDefault();
        e.stopPropagation();

    }, true);

    // =========================================================================
    // TAB 1: OVERVIEW
    // =========================================================================
    function renderOverview(filtered) {
      if (!filtered.length) return renderEmptyState();

      const hasDec = MATCHES.some(x => x.monthIdx === 11);
      const activeMonths = hasDec ? MONTHS : MONTHS.slice(0, 11);
      const monthly = activeMonths.map((name, i) => {
        const list = filtered.filter(m => m.monthIdx === i);
        const w = list.filter(x => x.res === 'V').length;
        const l = list.filter(x => x.res === 'D').length;
        const d = list.filter(x => x.res === 'E').length;
        const total = list.length;
        return { i, name, short: MONTHS_SHORT[i], total, w, l, d, wr: total ? w / total : null };
      });
      const maxM = Math.max(1, ...monthly.map(m => m.total));

      const W = 720, H = 240, padL = 34, padR = 38, padT = 18, padB = 30;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const stepX = plotW / monthly.length;
      const barW = Math.min(34, stepX * 0.56);

      const gridLines = [0, 0.25, 0.5, 0.75, 1].map(frac => {
        const y = padT + plotH * (1 - frac);
        return `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#1E1A16" stroke-opacity="${frac === 0 ? '0.9' : '0.14'}" stroke-width="${frac === 0 ? '2' : '1'}" stroke-dasharray="${frac === 0 ? '' : '4,4'}" />
          <text x="${padL - 7}" y="${y + 4}" text-anchor="end" fill="#57534E" font-size="11" font-weight="700">${Math.round(maxM * frac)}</text>
          <text x="${W - padR + 7}" y="${y + 4}" text-anchor="start" fill="#57534E" font-size="11" font-weight="700">${Math.round(frac * 100)}%</text>
        `;
      }).join('');

      const linePts = [];
      const barsSvg = monthly.map((m, idx) => {
        const cx = padL + stepX * idx + stepX / 2;
        const bx = cx - barW / 2;
        const hW = (m.w / maxM) * plotH;
        const hD = (m.d / maxM) * plotH;
        const hL = (m.l / maxM) * plotH;
        const yW = padT + plotH - hW;
        const yD = yW - hD;
        const yL = yD - hL;
        if (m.wr !== null) linePts.push({ x: cx, y: padT + plotH * (1 - m.wr), m });
        const tip = esc(`<strong>${m.name} 2026</strong><br/>Partidas: ${m.total}<br/>Vitórias: ${m.w} · Derrotas: ${m.l}${m.d ? ` · Empates: ${m.d}` : ''}<br/>Win Rate: <strong>${m.wr !== null ? fmtPct(m.wr) : '—'}</strong><br/><em>Clique para filtrar</em>`);
        const isSel = state.month !== 'all' && Number(state.month) === idx;
        return `
          <g class="cursor-pointer" data-click-month="${idx}" data-tip="${tip}">
            <rect x="${bx - 5}" y="${padT}" width="${barW + 10}" height="${plotH}" rx="6" fill="${isSel ? '#F0BE57' : 'transparent'}" fill-opacity="${isSel ? '0.45' : '0'}" />
            ${m.w ? `<rect x="${bx}" y="${yW}" width="${barW}" height="${hW}" rx="3" fill="#82AAC7" stroke="#1E1A16" stroke-width="1.8" />` : ''}
            ${m.d ? `<rect x="${bx}" y="${yD}" width="${barW}" height="${hD}" fill="#F0BE57" stroke="#1E1A16" stroke-width="1.8" />` : ''}
            ${m.l ? `<rect x="${bx}" y="${yL}" width="${barW}" height="${hL}" rx="3" fill="#C03A22" stroke="#1E1A16" stroke-width="1.8" />` : ''}
            <text x="${cx}" y="${H - 9}" text-anchor="middle" fill="#1E1A16" font-weight="${isSel ? '900' : '700'}" font-size="11">${m.short}</text>
          </g>
        `;
      }).join('');

      const linePath = linePts.length > 1
        ? `<path d="${linePts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')}" fill="none" stroke="#1E1A16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`
        : '';
      const lineDots = linePts.map(p => {
        const tip = esc(`<strong>${p.m.name}</strong><br/>Win Rate: <strong>${fmtPct(p.m.wr)}</strong> (${p.m.w}/${p.m.total})`);
        return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="#F0BE57" stroke="#1E1A16" stroke-width="2.2" class="cursor-pointer" data-click-month="${p.m.i}" data-tip="${tip}" />`;
      }).join('');

      const podBuckets = [
        { key: '2', label: '1v1 (Duelo)', exp: 0.50, color: '#82AAC7', list: filtered.filter(m => m.pod === 2) },
        { key: '3', label: 'Mesa de 3 Jog.', exp: 1 / 3, color: '#F0BE57', list: filtered.filter(m => m.pod === 3) },
        { key: '4+', label: 'Mesa de 4+ Jog.', exp: 0.25, color: '#D58A4B', list: filtered.filter(m => m.pod >= 4) }
      ];

      // Cumulative Win Rate SVG
      const cumPts = [];
      let cw = 0;
      filtered.forEach((m, idx) => {
        if (m.res === 'V') cw++;
        cumPts.push({ idx: idx + 1, wr: cw / (idx + 1), m });
      });
      const CW = 680, CH = 155, cpL = 38, cpR = 14, cpT = 14, cpB = 24;
      const cPlotW = CW - cpL - cpR, cPlotH = CH - cpT - cpB;
      const cPointsStr = cumPts.map((pt, i) => {
        const x = cpL + (cumPts.length === 1 ? cPlotW / 2 : (i / (cumPts.length - 1)) * cPlotW);
        const y = cpT + cPlotH * (1 - pt.wr);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const cLinePath = cumPts.length > 1 ? `M ${cPointsStr.join(' L ')}` : '';
      const cAreaPath = cumPts.length > 1 ? `M ${cpL},${cpT + cPlotH} L ${cPointsStr.join(' L ')} L ${(cpL + cPlotW).toFixed(1)},${cpT + cPlotH} Z` : '';
      const stepHover = Math.max(1, Math.floor(cumPts.length / 45));
      const cHoverCircles = cumPts.filter((_, i) => i % stepHover === 0 || i === cumPts.length - 1).map(pt => {
        const i = pt.idx - 1;
        const x = cpL + (cumPts.length === 1 ? cPlotW / 2 : (i / (cumPts.length - 1)) * cPlotW);
        const y = cpT + cPlotH * (1 - pt.wr);
        const tip = esc(`<strong>Partida #${pt.idx} (${pt.m.id})</strong><br/>${pt.m.month} · ${shortDeck(pt.m.deck, 26)}<br/>Resultado: <strong>${pt.m.resLabel}</strong><br/>Win Rate acumulado: <strong>${fmtPct(pt.wr)}</strong>`);
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="transparent" data-tip="${tip}" class="cursor-crosshair" />`;
      }).join('');

      const recent20 = filtered.slice(-20);
      const topDecks = groupDecks(filtered).sort((a, b) => b.games - a.games).slice(0, 6);
      const topPlayers = groupPlayers(filtered).sort((a, b) => b.games - a.games).slice(0, 6);
      const maxPlayerGames = Math.max(1, ...topPlayers.map(p => p.games));

      return `
        <!-- My Decks Collection Folder Grid (Signature Reference Section) -->
        <section class="space-y-3">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div>
              <h2 class="text-lg font-black tracking-tight">${state.onlyFavorites ? '★ Meus Decks Favoritos' : 'Meus Principais Decks'}</h2>
              <p class="text-xs font-semibold text-muted">Clique na estrela ☆ para favoritar ou na pasta para abrir o Raio-X</p>
            </div>
            <div class="flex items-center gap-2">
              <button data-toggle-fav-filter="1" class="nb-btn ${state.onlyFavorites ? 'nb-btn-yellow' : ''} px-3 py-1.5 text-xs">★ Favoritos (${favoriteDecks.size})</button>
              <button data-goto-tab="decks" class="nb-btn px-3 py-1.5 text-xs">Ver todos (${groupDecks(filtered).length}) →</button>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            ${topDecks.map(d => renderDeckFolderCard(d, false, 'jump')).join('')}
          </div>
        </section>

        <!-- Charts Row -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="nb-card p-4 lg:col-span-2 flex flex-col justify-between">
            <div class="flex items-start justify-between gap-2 mb-2 flex-wrap">
              <div>
                <h2 class="text-sm font-black">Evolução Mensal &amp; Taxa de Vitória</h2>
                <p class="text-xs font-medium text-muted">Clique em qualquer mês para filtrar o painel</p>
              </div>
              <div class="flex items-center gap-2.5 text-xs font-bold">
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block border border-[#1E1A16]" style="background:#82AAC7"></span>Vitórias</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block border border-[#1E1A16]" style="background:#C03A22"></span>Derrotas</span>
                <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded-full inline-block border-2 border-[#1E1A16]" style="background:#F0BE57"></span>Win Rate %</span>
              </div>
            </div>
            <svg viewBox="0 0 ${W} ${H}" class="w-full h-auto overflow-visible">
              ${gridLines}
              ${barsSvg}
              ${linePath}
              ${lineDots}
            </svg>
          </div>

          <div class="nb-card p-4 flex flex-col justify-between space-y-3">
            <div>
              <h2 class="text-sm font-black">Desempenho por Mesa</h2>
              <p class="text-xs font-medium text-muted">Win rate real vs. esperado (1 / jogadores)</p>
            </div>
            <div class="space-y-2.5 flex-1 flex flex-col justify-center">
              ${podBuckets.map(b => {
                const cnt = b.list.length;
                const w = b.list.filter(x => x.res === 'V').length;
                const wr = cnt ? w / cnt : 0;
                const diff = (wr - b.exp) * 100;
                const isSel = state.pod === b.key;
                return `
                  <button data-click-pod="${b.key}" class="w-full text-left nb-subtle p-3 cursor-pointer hover:bg-[#FFFDF2] transition-colors ${isSel ? 'bg-[#F8EFD5] shadow-[3px_3px_0_#1E1A16]' : ''}">
                    <div class="flex items-center justify-between gap-2 text-xs">
                      <span class="font-extrabold">${esc(b.label)}</span>
                      <span class="font-bold text-muted tabular-nums">${cnt} jogos (${w}V)</span>
                    </div>
                    <div class="flex items-baseline justify-between gap-2 mt-1">
                      <span class="text-lg font-black tabular-nums">${cnt ? fmtPct(wr) : '—'}</span>
                      ${cnt ? `<span class="text-xs px-1.5 py-0.2 rounded ${diff >= 0 ? 'badge-win' : 'badge-loss'}">${diff >= 0 ? '+' : ''}${diff.toFixed(1).replace('.', ',')} pp</span>` : ''}
                    </div>
                    <div class="relative w-full h-3 rounded-full bg-[#FFFFFF] border-2 border-[#1E1A16] mt-2 overflow-hidden">
                      <div class="h-full" style="width:${(wr * 100).toFixed(1)}%; background:${b.color};"></div>
                      <div class="absolute top-0 bottom-0 w-1 bg-[#1E1A16]" style="left:${(b.exp * 100).toFixed(1)}%;" data-tip="Esperado: ${fmtPct(b.exp)}"></div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>

        <!-- Cumulative Win Rate + Top Rivals -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <div class="nb-card p-4 lg:col-span-2 space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h2 class="text-sm font-black">Curva de Win Rate Acumulado &amp; Forma Recente</h2>
                <p class="text-xs font-medium text-muted">Ao longo das ${filtered.length} partidas (tracejado = 50%)</p>
              </div>
              <div class="flex items-center gap-1 flex-wrap">
                ${recent20.map(m => {
                  const cls = m.res === 'V' ? 'badge-win' : (m.res === 'D' ? 'badge-loss' : 'badge-draw');
                  const tip = esc(`<strong>${m.id}</strong> (${m.month})<br/>Deck: ${m.deck}<br/>Mesa ${m.pod}P · <strong>${m.resLabel}</strong><br/>vs. ${m.oppStr}`);
                  return `<span class="inline-flex items-center justify-center w-6 h-6 rounded-md text-xs ${cls} cursor-default" data-tip="${tip}">${m.res}</span>`;
                }).join('')}
              </div>
            </div>
            <svg viewBox="0 0 ${CW} ${CH}" class="w-full h-auto overflow-visible">
              ${[0, 0.25, 0.5, 0.75, 1].map(f => {
                const y = cpT + cPlotH * (1 - f);
                return `
                  <line x1="${cpL}" y1="${y}" x2="${CW - cpR}" y2="${y}" stroke="#1E1A16" stroke-opacity="${f === 0.5 ? '0.6' : '0.12'}" stroke-width="${f === 0.5 ? '1.8' : '1'}" stroke-dasharray="${f === 0.5 ? '5,5' : '2,3'}" />
                  <text x="${cpL - 6}" y="${y + 4}" text-anchor="end" fill="#57534E" font-size="11" font-weight="700">${Math.round(f * 100)}%</text>
                `;
              }).join('')}
              ${cAreaPath ? `<path d="${cAreaPath}" fill="#F0BE57" fill-opacity="0.32" />` : ''}
              ${cLinePath ? `<path d="${cLinePath}" fill="none" stroke="#1E1A16" stroke-width="2.6" stroke-linejoin="round" />` : ''}
              ${cHoverCircles}
              <text x="${cpL}" y="${CH - 4}" fill="#57534E" font-size="11" font-weight="700">#1 (${esc(filtered[0].id)})</text>
              <text x="${CW - cpR}" y="${CH - 4}" text-anchor="end" fill="#57534E" font-size="11" font-weight="700">#${filtered.length} (${esc(filtered[filtered.length - 1].id)})</text>
            </svg>
          </div>

          <div class="nb-card p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-black">Rivais Frequentes</h2>
              <button data-goto-tab="opponents" class="text-xs font-extrabold underline cursor-pointer">Ver todos →</button>
            </div>
            <div class="space-y-2.5">
              ${topPlayers.length ? topPlayers.map(p => `
                <button data-jump-rival="${esc(p.player)}" class="w-full text-left group cursor-pointer">
                  <div class="flex items-center justify-between text-xs gap-2 mb-1">
                    <span class="font-extrabold truncate group-hover:underline">${esc(p.player)} <span class="text-muted font-semibold">· ${p.games}j</span></span>
                    <span class="tabular-nums font-black ${wrClass(p.wr)}">${fmtPct(p.wr)} <span class="text-muted font-bold">(${p.w}–${p.l})</span></span>
                  </div>
                  <div class="w-full h-3 rounded-full bg-[#F8EFD5] border-2 border-[#1E1A16] overflow-hidden flex">
                    <div style="width:${(p.w / maxPlayerGames * 100).toFixed(1)}%; background:#82AAC7"></div>
                    ${p.d ? `<div style="width:${(p.d / maxPlayerGames * 100).toFixed(1)}%; background:#F0BE57"></div>` : ''}
                    <div style="width:${(p.l / maxPlayerGames * 100).toFixed(1)}%; background:#C03A22"></div>
                  </div>
                </button>
              `).join('') : '<p class="text-xs text-muted">Nenhum jogador nomeado neste recorte.</p>'}
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // TAB 2: DECKS (FOLDER COLLECTION + TABLE + X-RAY + SCATTER)
    // =========================================================================
    function renderDecks(filtered) {
      if (!filtered.length) return renderEmptyState();

      let decks = groupDecks(filtered);
      if (state.deckSearch.trim()) {
        const q = state.deckSearch.trim().toLowerCase();
        decks = decks.filter(d => d.deck.toLowerCase().includes(q));
      }
      const visibleDecks = decks.filter(d => d.games >= state.deckMinGames);

      visibleDecks.sort((a, b) => {
        if (state.deckSort === 'weighted') return (b.wilson - a.wilson) || (b.games - a.games);
        if (state.deckSort === 'fav') {
          const fa = isFavDeck(a.deck) ? 1 : 0, fb = isFavDeck(b.deck) ? 1 : 0;
          if (fb !== fa) return fb - fa;
          return (b.games - a.games) || (b.wr - a.wr);
        }
        if (state.deckSort === 'wr') {
          const qa = a.games >= 5 ? 1 : 0, qb = b.games >= 5 ? 1 : 0;
          if (qb !== qa) return qb - qa;
          return (b.wr - a.wr) || (b.games - a.games);
        }
        if (state.deckSort === 'wins') return (b.w - a.w) || (b.wr - a.wr);
        if (state.deckSort === 'name') return a.deck.localeCompare(b.deck, 'pt-BR');
        return (b.games - a.games) || (b.wr - a.wr);
      });

      const splitHonorable = state.deckSort === 'wr' && visibleDecks.some(d => d.games >= 5) && visibleDecks.some(d => d.games < 5);
      const mainDecks = splitHonorable ? visibleDecks.filter(d => d.games >= 5) : visibleDecks;
      const honorableDecks = splitHonorable ? visibleDecks.filter(d => d.games < 5) : [];
      const showWeighted = state.deckSort === 'weighted';

      const activeDeckObj = visibleDecks.find(d => d.deck === state.selectedDeck) || mainDecks[0] || visibleDecks[0] || null;

      // Scatter SVG
      const SW = 620, SH = 230, spL = 42, spR = 24, spT = 18, spB = 34;
      const sPlotW = SW - spL - spR, sPlotH = SH - spT - spB;
      const maxG = Math.max(5, ...visibleDecks.map(d => d.games));
      const xMax = Math.ceil((maxG + 2) / 5) * 5;
      const xTicks = [];
      for (let v = 0; v <= xMax; v += (xMax <= 10 ? 2 : 5)) xTicks.push(v);

      const bubbles = visibleDecks.map(d => {
        const cx = spL + (d.games / xMax) * sPlotW;
        const cy = spT + sPlotH * (1 - d.wr);
        const r = Math.max(6, Math.min(15, 5 + Math.sqrt(d.games) * 1.8));
        const isSel = activeDeckObj && activeDeckObj.deck === d.deck;
        const tip = esc(`<strong>${d.deck}</strong><br/>Jogos: ${d.games} (${d.w}V–${d.l}D${d.d ? `–${d.d}E` : ''})<br/>Win Rate: <strong>${fmtPct(d.wr)}</strong> (esp. ${fmtPct(d.expWr)})`);
        return `
          <g class="cursor-pointer" data-select-deck="${esc(d.deck)}" data-tip="${tip}">
            <circle cx="${(cx + 2).toFixed(1)}" cy="${(cy + 2).toFixed(1)}" r="${r.toFixed(1)}" fill="#1E1A16" />
            <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${wrBarColor(d.wr)}" stroke="#1E1A16" stroke-width="${isSel ? '3' : '2'}" />
            ${d.games >= 8 || isSel ? `<text x="${cx.toFixed(1)}" y="${(cy - r - 5).toFixed(1)}" text-anchor="middle" fill="#1E1A16" font-size="10.5" font-weight="800">${esc(shortDeck(d.deck, 14))}</text>` : ''}
          </g>
        `;
      }).join('');

      let xrayHtml = '';
      if (activeDeckObj) {
        const dm = activeDeckObj.matches;
        const ds = calcStats(dm);
        const acc = deckAccent(activeDeckObj);
        const activeBadges = getDeckBadges(activeDeckObj, { honorable: activeDeckObj.games < 5 });
        const dPlayers = groupPlayers(dm).sort((a, b) => b.games - a.games).slice(0, 6);
        const dPods = [
          { label: '1v1', list: dm.filter(x => x.pod === 2) },
          { label: '3P', list: dm.filter(x => x.pod === 3) },
          { label: '4+P', list: dm.filter(x => x.pod >= 4) }
        ];
        const customStyle = deckStyles[activeDeckObj.deck] || {};
        xrayHtml = `
          <div class="nb-folder">
            <div class="nb-folder-tab" style="background:${acc.color}"></div>
            <div class="nb-folder-body p-4 space-y-3.5">
              <div class="flex items-start justify-between gap-2">
                <div class="flex items-start gap-2.5 min-w-0">
                  <button data-toggle-customizer="1" data-tip="Clique para escolher o ícone e a cor da pasta deste deck."
                    class="nb-icon-box cursor-pointer hover:scale-105 transition-transform shadow-[2px_2px_0_#1E1A16]"
                    style="background:${acc.color}; color:${acc.ink || '#1E1A16'}">
                    ${acc.icon}
                  </button>
                  <div class="min-w-0">
                    <span class="px-2 py-0.5 rounded text-xs badge-pop-yellow">RAIO-X DO DECK</span>
                    <h3 class="text-base font-black mt-1 leading-snug">${esc(activeDeckObj.deck)}</h3>
                    ${activeBadges.length ? `<div class="flex items-center gap-1 flex-wrap mt-1.5">${renderBadgesHtml(activeBadges)}</div>` : ''}
                  </div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button data-toggle-fav="${esc(activeDeckObj.deck)}" data-tip="${isFavDeck(activeDeckObj.deck) ? 'Remover este deck dos favoritos.' : 'Marcar este deck como favorito.'}"
                    class="nb-btn ${isFavDeck(activeDeckObj.deck) ? 'nb-btn-yellow' : ''} px-2.5 py-1 text-xs">
                    ${isFavDeck(activeDeckObj.deck) ? '★' : '☆'}
                  </button>
                  <button data-filter-deck="${esc(activeDeckObj.deck)}" data-tip="Filtra todo o painel para mostrar apenas partidas com este deck." class="nb-btn nb-btn-yellow px-2.5 py-1 text-xs">Filtrar</button>
                </div>
              </div>

              <!-- Toggleable Customizer Drawer (Icon + Folder Color) -->
              <div class="space-y-2">
                <button data-toggle-customizer="1" class="w-full nb-pill px-3 py-1.5 text-xs flex items-center justify-between ${state.showDeckCustomizer ? 'nb-pill-active' : ''}" data-tip="Personalize o ícone temático e a cor da pasta deste deck (salvo no navegador).">
                  <span>Personalizar ícone e cor da pasta</span>
                  <span>${state.showDeckCustomizer ? '▲' : '▼'}</span>
                </button>
                ${state.showDeckCustomizer ? `
                  <div class="nb-subtle p-3 space-y-3">
                    <div class="space-y-1.5">
                      <div class="flex items-center justify-between text-xs">
                        <span class="font-extrabold">Cor da pasta</span>
                        ${(customStyle.color || customStyle.icon) ? `<button data-reset-deck-style="${esc(activeDeckObj.deck)}" class="text-xs font-extrabold underline cursor-pointer" data-tip="Volta o ícone e a cor para o modo automático por faixa de Win Rate.">Restaurar auto</button>` : ''}
                      </div>
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <button data-set-deck-color="auto" data-style-deck="${esc(activeDeckObj.deck)}" data-tip="Automático: define a cor pela faixa de Win Rate do deck."
                          class="nb-pill px-2 py-1 text-xs ${!customStyle.color ? 'nb-pill-active' : ''}">Auto</button>
                        ${PALETTE_OPTIONS.map(p => `
                          <button data-set-deck-color="${p.key}" data-style-deck="${esc(activeDeckObj.deck)}" data-tip="${esc(p.label)}"
                            class="w-7 h-7 rounded-lg border-2 border-[#1E1A16] cursor-pointer transition-transform hover:scale-105 ${customStyle.color === p.key ? 'ring-2 ring-[#1E1A16] ring-offset-1 shadow-[2px_2px_0_#1E1A16]' : ''}"
                            style="background:${p.color};"></button>
                        `).join('')}
                      </div>
                    </div>

                    <div class="space-y-1.5">
                      <div class="flex items-center justify-between text-xs">
                        <span class="font-extrabold">Ícone do deck</span>
                        <button data-set-deck-icon="auto" data-style-deck="${esc(activeDeckObj.deck)}" data-tip="Voltar o ícone para o padrão automático por Win Rate."
                          class="nb-pill px-2 py-0.5 text-xs ${!customStyle.icon ? 'nb-pill-active' : ''}">Auto</button>
                      </div>
                      <div class="grid grid-cols-8 gap-1.5">
                        ${ICON_CATALOG.map(ic => {
                          const isActive = customStyle.icon === ic.key;
                          return `
                            <button data-set-deck-icon="${ic.key}" data-style-deck="${esc(activeDeckObj.deck)}" data-tip="${esc(ic.label)}"
                              class="h-8 rounded-lg border-2 border-[#1E1A16] inline-flex items-center justify-center cursor-pointer transition-all ${isActive ? 'bg-[#F0BE57] shadow-[2px_2px_0_#1E1A16]' : 'bg-[#FFFDF7] hover:bg-[#F0BE57]'}">
                              ${ICONS[ic.key]}
                            </button>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  </div>
                ` : ''}
              </div>

              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="nb-subtle p-2" data-tip="${esc(`Taxa de vitória geral com este deck: ${ds.w} vitória(s) em ${ds.total} partida(s) (taxa esperada pelas mesas: ${fmtPct(ds.expWr)}).`)}">
                  <div class="text-xs font-bold text-muted">Win Rate</div>
                  <div class="text-lg font-black tabular-nums ${wrClass(ds.wr)}">${fmtPct(ds.wr)}</div>
                </div>
                <div class="nb-subtle p-2" data-tip="${esc(`Total de Vitórias–Derrotas${ds.d ? '–Empates' : ''} com este deck (${ds.w}V, ${ds.l}D${ds.d ? `, ${ds.d}E` : ''}).`)}">
                  <div class="text-xs font-bold text-muted">Placar</div>
                  <div class="text-lg font-black tabular-nums">${ds.w}–${ds.l}${ds.d ? `–${ds.d}` : ''}</div>
                </div>
                <div class="nb-subtle p-2" data-tip="${esc(`Maior sequência consecutiva de vitórias alcançada com este deck (pior sequência de derrotas: ${ds.worstLoss}D).`)}">
                  <div class="text-xs font-bold text-muted">Streak</div>
                  <div class="text-lg font-black tabular-nums">${ds.bestWin}V</div>
                </div>
              </div>

              <div class="space-y-1.5">
                <div class="text-xs font-extrabold" data-tip="Separa o aproveitamento deste deck por quantidade de jogadores na mesa (1v1, 3 jogadores ou 4+ jogadores).">Por Tamanho de Mesa</div>
                <div class="grid grid-cols-3 gap-2">
                  ${dPods.map(p => {
                    const pw = p.list.filter(x => x.res === 'V').length;
                    const pwr = p.list.length ? pw / p.list.length : null;
                    const pTip = esc(p.list.length
                      ? `Aproveitamento com este deck em mesas ${p.label}: ${pw} vitória(s) em ${p.list.length} partida(s) (${fmtPct(pwr)}).`
                      : `Nenhuma partida registrada com este deck em mesas ${p.label}.`);
                    return `
                      <div class="nb-subtle px-2.5 py-1.5 text-xs" data-tip="${pTip}">
                        <div class="font-bold text-muted">${p.label}</div>
                        <div class="font-black tabular-nums mt-0.5 ${pwr !== null ? wrClass(pwr) : ''}">${pwr !== null ? fmtPct(pwr, 0) : '—'}</div>
                        <div class="text-muted font-semibold tabular-nums">${p.list.length ? `${pw}V/${p.list.length}j` : '0j'}</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

    function getRivalCommanders(matches, playerName) {
      const aliases = playerName === 'Josué' ? ['josué', 'josu']
        : playerName === 'Mateus' ? ['mateus', 'matheus']
        : [playerName.toLowerCase()];
      const map = new Map();
      for (const m of matches) {
        const chunks = m.oppStr.split(/\)\s*(?:,\s*|\s+e\s+)/);
        let foundCmd = '';
        for (const rawCh of chunks) {
          const ch = rawCh.trim();
          const pMatch = ch.match(/\(([^)]+)\)?\s*$/);
          if (!pMatch) continue;
          const inside = pMatch[1].toLowerCase().replace(/\s*-\s*vencedor.*$/, '').replace(/\s*-\s*rio.*$/, '').trim();
          const parts = inside.split(/\/\/|\//).map(x => x.trim());
          if (parts.some(pt => aliases.includes(pt))) {
            foundCmd = ch.slice(0, pMatch.index).replace(/^[,.\s]+|[,.\s]+$/g, '');
            break;
          }
        }
        if (foundCmd) {
          if (!map.has(foundCmd)) map.set(foundCmd, { cmd: foundCmd, games: 0, w: 0, l: 0, d: 0 });
          const g = map.get(foundCmd);
          g.games++;
          if (m.res === 'V') g.w++;
          else if (m.res === 'D') g.l++;
          else g.d++;
        }
      }
      return Array.from(map.values()).sort((a, b) => b.games - a.games);
    }

    // =========================================================================
    // TAB 5: REPORTAR PARTIDA
    // =========================================================================
    let toastTimer = null;
    function showToast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.style.backgroundColor = type === 'error' ? '#C03A22' : '#82AAC7';
      el.style.color = type === 'error' ? '#F8EFD5' : '#1E1A16';
      el.innerHTML = `<span>${type === 'error' ? '!' : '✓'}</span><span>${esc(msg)}</span>`;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
    }

    function copyTextToClipboard(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg), () => fallbackCopy(text, successMsg));
      } else fallbackCopy(text, successMsg);
    }
    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(successMsg); }
      catch (_) { showToast('Selecione e copie o texto manualmente.', 'error'); }
      ta.remove();
    }

    function getDeckLabelFromReport(rep) {
      const d = (rep.deck || '').trim();
      if (!d) return '';
      if (rep.borrowed && !/\(emprestado\)/i.test(d)) return `${d} (emprestado)`;
      return d;
    }

    function formatOpponentsLines(rep) {
      const filled = rep.opponents.filter(o => o.cmd.trim() || o.player.trim());
      const source = filled.length ? filled : rep.opponents;
      return source.map(o => {
        const cmd = o.cmd.trim() || '[Comandante]';
        const pl = o.player.trim();
        const isWin = rep.res === 'D' && o.winner;
        if (pl) return `- ${cmd} (${pl}${isWin ? ' - VENCEDOR' : ''})`;
        if (isWin) return `- ${cmd} (VENCEDOR)`;
        return `- ${cmd}`;
      });
    }

    function formatOppSummary(opponents, res) {
      const filled = opponents.filter(o => o.cmd.trim() || o.player.trim());
      const items = filled.map(o => {
        const cmd = o.cmd.trim() || 'Desconhecido';
        const pl = o.player.trim();
        const isWin = res === 'D' && o.winner;
        if (pl) return `${cmd} (${pl}${isWin ? ' - VENCEDOR' : ''})`;
        if (isWin) return `${cmd} (VENCEDOR)`;
        return cmd;
      });
      if (items.length <= 1) return items[0] || '';
      if (items.length === 2) return `${items[0]} e ${items[1]}`;
      return `${items.slice(0, -1).join(', ')} e ${items[items.length - 1]}`;
    }

    function buildReportText(rep) {
      const lines = [
        `Mês: ${MONTHS[rep.monthIdx] || 'Novembro'}`,
        `Meu Deck: ${getDeckLabelFromReport(rep) || '[Seu Deck]'}`,
        `Resultado: ${rep.res}`
      ];
      if (rep.ordem) lines.push(`Ordem de Jogada: ${rep.ordem}`);
      lines.push('', 'Oponentes:');
      formatOpponentsLines(rep).forEach(l => lines.push(l));
      lines.push('', 'Notas:');
      if (rep.notes.trim()) lines.push(rep.notes.trim());
      return lines.join('\n');
    }

    function buildReportTextFromMatch(m) {
      const lines = [`Mês: ${m.month}`, `Meu Deck: ${m.deck}`, `Resultado: ${m.res}`];
      if (m.ordem) lines.push(`Ordem de Jogada: ${m.ordem}`);
      lines.push('', 'Oponentes:');
      if (m.rawOpponents && m.rawOpponents.length) {
        m.rawOpponents.forEach(o => {
          const isWin = m.res === 'D' && o.winner;
          if (o.player) lines.push(`- ${o.cmd} (${o.player}${isWin ? ' - VENCEDOR' : ''})`);
          else if (isWin) lines.push(`- ${o.cmd} (VENCEDOR)`);
          else lines.push(`- ${o.cmd}`);
        });
      } else lines.push(`- ${m.oppStr}`);
      lines.push('', 'Notas:');
      if (m.note) lines.push(m.note);
      return lines.join('\n');
    }

    function buildSheetsTsv(rep) {
      const resLabel = rep.res === 'V' ? 'Vitória' : (rep.res === 'D' ? 'Derrota' : 'Empate');
      let fullNotes = `Oponentes: ${formatOppSummary(rep.opponents, rep.res)}.`;
      if (rep.notes.trim()) fullNotes += ` Notas: ${rep.notes.trim()}`;
      return [nextSuggestedId(), MONTHS[rep.monthIdx] || 'Novembro', rep.year || '2026', getDeckLabelFromReport(rep), rep.ordem || '', resLabel, fullNotes].join('\t');
    }

    function parseOpponentBullet(raw, targetArr) {
      const clean = raw.replace(/^[-•*]\s*/, '').trim();
      if (!clean) return;
      const parenMatch = clean.match(/\(([^)]+)\)\s*$/);
      let cmd = clean, player = '', winner = false;
      if (parenMatch) {
        cmd = clean.slice(0, parenMatch.index).trim();
        const inside = parenMatch[1].trim();
        winner = /vencedor/i.test(inside);
        player = inside.replace(/\s*-?\s*vencedor/i, '').trim();
      }
      targetArr.push({ cmd, player, winner });
    }

    function parseTemplateText(text) {
      const lines = text.replace(/\r\n/g, '\n').split('\n');
      const rep = { monthIdx: state.report.monthIdx, year: '2026', deck: '', borrowed: false, res: 'V', ordem: '', opponents: [], notes: '' };
      let section = 'header';
      const notesLines = [];
      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;
        if (/^m[eê]s\s*:/i.test(line)) {
          const val = line.replace(/^m[eê]s\s*:/i, '').trim().toLowerCase();
          const idx = MONTHS.findIndex(m => m.toLowerCase().startsWith(val.slice(0, 3)));
          if (idx >= 0) rep.monthIdx = idx;
          continue;
        }
        if (/^(?:meu\s*)?deck\s*:/i.test(line)) {
          const val = line.replace(/^(?:meu\s*)?deck\s*:/i, '').trim();
          rep.borrowed = /\(emprestado\)/i.test(val);
          rep.deck = val;
          continue;
        }
        if (/^resultado\s*:/i.test(line)) {
          const val = line.replace(/^resultado\s*:/i, '').trim().toUpperCase();
          rep.res = val.startsWith('D') ? 'D' : (val.startsWith('E') ? 'E' : 'V');
          continue;
        }
        if (/^ordem(?:\s+de\s+jogada)?\s*:/i.test(line)) {
          rep.ordem = line.replace(/^ordem(?:\s+de\s+jogada)?\s*:/i, '').trim();
          continue;
        }
        if (/^oponentes?\s*:/i.test(line)) {
          section = 'opponents';
          const inline = line.replace(/^oponentes?\s*:/i, '').trim();
          if (inline) parseOpponentBullet(inline, rep.opponents);
          continue;
        }
        if (/^notas?\s*:/i.test(line)) {
          section = 'notes';
          const inline = line.replace(/^notas?\s*:/i, '').trim();
          if (inline) notesLines.push(inline);
          continue;
        }
        if (section === 'opponents' || line.startsWith('-')) { section = 'opponents'; parseOpponentBullet(line, rep.opponents); }
        else if (section === 'notes') notesLines.push(rawLine.trim());
      }
      if (!rep.opponents.length) rep.opponents = [{ cmd: '', player: '', winner: false }];
      rep.notes = notesLines.join('\n').trim();
      return rep;
    }

    function submitReportToPanel() {
      const rep = state.report;
      const deckName = getDeckLabelFromReport(rep);
      const validOpps = rep.opponents
        .map(o => ({ cmd: o.cmd.trim(), player: o.player.trim(), winner: rep.res === 'D' && !!o.winner }))
        .filter(o => o.cmd || o.player);

      if (!deckName) { showToast('Informe o nome do seu deck.', 'error'); return; }
      if (!validOpps.length) { showToast('Adicione pelo menos um oponente.', 'error'); return; }

      const normPlayer = p => (p === 'Josu' ? 'Josué' : (p === 'Matheus' ? 'Mateus' : p));
      const players = [], enemyCmds = [];
      let winnerPlayer = '';
      validOpps.forEach(o => {
        if (o.cmd) enemyCmds.push(o.cmd);
        if (o.player) {
          const np = normPlayer(o.player);
          if (!players.includes(np)) players.push(np);
          if (o.winner) winnerPlayer = np;
        }
      });

      const newMatch = {
        n: MATCHES.length + 1,
        id: nextSuggestedId(),
        monthIdx: rep.monthIdx,
        month: MONTHS[rep.monthIdx],
        deckIdx: -1,
        deck: deckName,
        borrowed: deckName.toLowerCase().includes('(emprestado)'),
        res: rep.res,
        resLabel: rep.res === 'V' ? 'Vitória' : (rep.res === 'D' ? 'Derrota' : 'Empate'),
        pod: validOpps.length + 1,
        players, winnerPlayer, enemyCmds,
        ordem: rep.ordem || '',
        oppStr: formatOppSummary(validOpps, rep.res),
        note: rep.notes.trim(),
        rawOpponents: validOpps,
        pending: true
      };

      pendingMatches.push(newMatch);
      savePendingMatches(pendingMatches);
      rebuildMatches();
      initFilterSelects();

      const keepCount = rep.opponents.length;
      state.report.deck = '';
      state.report.borrowed = false;
      state.report.ordem = '';
      state.report.notes = '';
      state.report.opponents = Array.from({ length: keepCount }, () => ({ cmd: '', player: '', winner: false }));

      render();
