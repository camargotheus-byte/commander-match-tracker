                    <th class="py-2.5 px-3 font-black whitespace-nowrap">${tr('Cores', 'Colors')}</th>
                    <th class="py-2.5 px-3 font-black whitespace-nowrap">${tr('Pilotos na mesa', 'Pilots')}</th>
                    <th class="py-2.5 px-3 font-black text-right whitespace-nowrap">${tr('Encontros', 'Encounters')}</th>
                    <th class="py-2.5 px-3 font-black text-right whitespace-nowrap">${tr('V–D–E', 'W–L–D')}</th>
                    <th class="py-2.5 px-3 sm:px-4 font-black min-w-[165px] whitespace-nowrap">${tr('Minha Taxa de Vitória', 'My Win Rate')}</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#DCCBAE]">
                  ${ecmds.map(c => {
                    const parts = c.cmd.split(/\s*\/\/\s*/).filter(Boolean);
                    const cmdLinks = parts.map(pt => `<a href="${esc(scryfallCardUrl(pt))}" target="_blank" rel="noopener noreferrer" data-tip="${esc(tr(`Abrir "${pt}" no Scryfall (nova aba).`, `View "${pt}" on Scryfall (new tab).`))}" class="hover:underline text-[#4E3626] inline-flex items-center gap-0.5">${esc(pt)}<span class="text-muted text-xs">↗</span></a>`).join(' <span class="text-muted">//</span> ');
                    const cols = getEnemyCmdColorIdentity(c.cmd);
                    const manaHtml = cols !== null ? renderManaIdentityHtml(cols, { size: 'sm', showColorless: true }) : '<span class="text-muted">—</span>';
                    return `
                    <tr data-filter-ecmd="${esc(c.cmd)}" class="interactive-row cursor-pointer">
                      <td class="py-2.5 px-3 sm:px-4 font-extrabold">${cmdLinks}</td>
                      <td class="py-2.5 px-3 whitespace-nowrap">${manaHtml}</td>
                      <td class="py-2.5 px-3 text-muted font-semibold">${esc(c.playersList.slice(0, 4).join(', '))}${c.playersList.length > 4 ? ` +${c.playersList.length - 4}` : ''}</td>
                      <td class="py-2.5 px-3 text-right tabular-nums font-black whitespace-nowrap">${c.games}</td>
                      <td class="py-2.5 px-3 text-right tabular-nums font-bold whitespace-nowrap">${c.w}–${c.l}${c.d ? `–${c.d}` : ''}</td>
                      <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap">
                        <div class="flex items-center gap-2">
                          <div class="flex-1 min-w-[72px] h-2.5 rounded-full bg-[#F3ECE0] border border-[#4E3626] overflow-hidden">
                            <div class="h-full" style="width:${(c.wr * 100).toFixed(1)}%; background:${wrBarColor(c.wr)}"></div>
                          </div>
                          <span class="w-12 text-right font-black tabular-nums shrink-0 ${wrClass(c.wr)}">${fmtPct(c.wr)}</span>
                        </div>
                      </td>
                    </tr>
                  `;
                  }).join('')}
                </tbody>
              </table>
            `)}
          </div>
        `;
      }

      const topDecks = groupDecks(filtered).sort((a, b) => b.games - a.games).slice(0, 12);
      const topPlayers = groupPlayers(filtered).sort((a, b) => b.games - a.games).slice(0, 10);

      return `
        ${subNav}
        <div class="nb-card overflow-hidden min-w-0">
          <div class="p-4 pb-3">
            <h2 class="text-sm font-black">${tr('Matriz Deck × Oponente', 'Deck × Opponent Matrix')}</h2>
            <p class="text-xs font-medium text-muted">${tr('Verde (Key Lime) ≥ 60% · Amarelo (Butter Sun) 45–59% · Coral (Aperol) &lt; 45%', 'Green (Key Lime) ≥ 60% · Yellow (Butter Sun) 45–59% · Coral (Aperol) &lt; 45%')}</p>
          </div>
          ${wrapHScroll(`
            <table class="w-full text-xs border-collapse">
              <thead>
                <tr class="border-b-2 border-[#4E3626]">
                  <th class="py-2 px-3 text-left font-black min-w-[180px] whitespace-nowrap">Deck</th>
                  ${topPlayers.map(p => `<th class="py-2 px-2 text-center font-black min-w-[72px] whitespace-nowrap">${esc(p.player)}</th>`).join('')}
                </tr>
              </thead>
              <tbody class="divide-y divide-[#DCCBAE]">
                ${topDecks.map(d => `
                  <tr>
                    <td class="py-2 px-3 font-extrabold leading-snug min-w-[200px]">${esc(deckDisplayName(d.deck))}</td>
                    ${topPlayers.map(p => {
                      const sub = filtered.filter(m => m.deck === d.deck && m.players.includes(p.player));
                      if (!sub.length) return `<td class="p-1 text-center text-muted opacity-40 font-bold">·</td>`;
                      const w = sub.filter(x => x.res === 'V').length;
                      const l = sub.filter(x => x.res === 'D').length;
                      const dr = sub.filter(x => x.res === 'E').length;
                      const wr = w / sub.length;
                      const bg = wr >= 0.6 ? '#C8CF7A' : (wr >= 0.45 ? '#F1D27A' : '#D7653A');
                      const fg = wr < 0.45 ? '#F3ECE0' : '#4E3626';
                      const tip = esc(tr(`<strong>${deckDisplayName(d.deck)}</strong> vs. <strong>${p.player}</strong><br/>Placar: ${fmtRecord(w, l, dr)} (${sub.length} jogos)<br/>Win Rate: <strong>${fmtPct(wr)}</strong>`, `<strong>${deckDisplayName(d.deck)}</strong> vs. <strong>${p.player}</strong><br/>Record: ${fmtRecord(w, l, dr)} (${sub.length} games)<br/>Win Rate: <strong>${fmtPct(wr)}</strong>`));
                      return `
                        <td class="p-1 text-center">
                          <button data-heatmap-deck="${esc(d.deck)}" data-heatmap-player="${esc(p.player)}" data-tip="${tip}"
                            class="w-full py-1.5 px-1 rounded-lg font-black tabular-nums border-2 border-[#4E3626] cursor-pointer hover:shadow-[2px_2px_0_#4E3626] transition-all"
                            style="background:${bg}; color:${fg};">
                            ${w}–${l}${dr ? `–${dr}` : ''}
                          </button>
                        </td>
                      `;
                    }).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `)}
        </div>
      `;
    }

    // =========================================================================
    // TAB 4: MATCH HISTORY
    // =========================================================================
    function renderHistory(filtered) {
      let list = filtered.slice();
      if (state.histRes !== 'all') list = list.filter(m => m.res === state.histRes);
      if (state.histSearch.trim()) {
        const q = state.histSearch.trim().toLowerCase();
        list = list.filter(m =>
          m.id.toLowerCase().includes(q) || m.deck.toLowerCase().includes(q) ||
          m.oppStr.toLowerCase().includes(q) || m.note.toLowerCase().includes(q) ||
          m.month.toLowerCase().includes(q)
        );
      }
      if (state.histOrder === 'desc') list.reverse();

      return `
        <div class="nb-card-sm p-3.5 flex flex-col md:flex-row md:items-center justify-between gap-3">
          <div class="flex items-center gap-2 flex-wrap flex-1">
            <input id="hist-search" type="search" value="${esc(state.histSearch)}" placeholder="${esc(tr('Filtrar no histórico...', 'Filter match history...'))}" class="px-3 py-1.5 text-xs flex-1 min-w-[200px]" />
            <div class="flex items-center gap-1">
              ${[{ k: 'all', l: tr('Todos', 'All') }, { k: 'V', l: tr('Vitórias', 'Wins') }, { k: 'D', l: tr('Derrotas', 'Losses') }, { k: 'E', l: tr('Empates', 'Draws') }].map(x => `
                <button data-hist-res="${x.k}" class="nb-pill px-2.5 py-1.5 text-xs ${state.histRes === x.k ? 'nb-pill-active' : ''}">${x.l}</button>
              `).join('')}
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button id="btn-hist-order" class="nb-btn px-3 py-1.5 text-xs">${state.histOrder === 'desc' ? tr('↓ Recentes', '↓ Latest') : tr('↑ Cronológica', '↑ Chronological')}</button>
            <button id="btn-export-csv" class="nb-btn nb-btn-yellow px-3 py-1.5 text-xs">${tr('Exportar CSV', 'Export CSV')} (${list.length})</button>
          </div>
        </div>

        ${list.length ? `
          <div class="nb-card overflow-hidden min-w-0">
            ${wrapHScroll(`
              <table class="w-full min-w-[680px] text-xs text-left border-collapse">
                <thead>
                  <tr class="border-b-2 border-[#4E3626] bg-[#F1D27A]">
                    <th class="py-2.5 px-3 font-black w-28 whitespace-nowrap">${tr('ID / Data', 'ID / Date')}</th>
                    <th class="py-2.5 px-3 font-black min-w-[190px] whitespace-nowrap">${tr('Meu Deck', 'My Deck')}</th>
                    <th class="py-2.5 px-2 font-black text-center w-16 whitespace-nowrap">${tr('Mesa', 'Pod')}</th>
                    <th class="py-2.5 px-2 font-black text-center w-16 whitespace-nowrap" data-tip="${esc(tr('Duração total da partida em turnos (quando informada).', 'Total match duration in turns (when recorded).'))}">${tr('Turnos', 'Turns')}</th>
                    <th class="py-2.5 px-2 font-black text-center w-24 whitespace-nowrap">${tr('Resultado', 'Result')}</th>
                    <th class="py-2.5 px-3 font-black whitespace-nowrap">${tr('Oponentes &amp; Notas', 'Opponents &amp; Notes')}</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-[#DCCBAE]">
                  ${list.map(m => {
                    const rCls = m.res === 'V' ? 'badge-win' : (m.res === 'D' ? 'badge-loss' : 'badge-draw');
                    const highlightedOpp = esc(oppDisplayStr(m.oppStr)).replace(/(\([^)]*(?:Vencedor|Winner)[^)]*\))/gi, '<strong class="px-1 rounded bg-[#F4D8C6] text-[#4E3626]">$1</strong>');
                    return `
                      <tr class="interactive-row align-top">
                        <td class="py-2.5 px-3 whitespace-nowrap">
                          <div class="flex items-center gap-1">
                            <span class="font-mono font-black">${esc(m.id)}</span>
                            ${m.pending ? '<span class="px-1 rounded text-xs badge-pop-purple">Local</span>' : ''}
                          </div>
                          <div class="text-muted font-semibold tabular-nums">${esc(matchDateLabel(m))}</div>
                        </td>
                        <td class="py-2.5 px-3">
                          <div class="font-extrabold">${esc(deckDisplayName(m.deck))}</div>
                          ${m.ordem ? `<span class="inline-block mt-1 px-1.5 py-0.2 rounded badge-neutral">${esc(ordemDisplay(m.ordem))}</span>` : ''}
                        </td>
                        <td class="py-2.5 px-2 text-center whitespace-nowrap">
                          <span class="inline-block px-2 py-0.5 rounded-md badge-neutral">${m.pod === 2 ? '1v1' : m.pod + 'P'}</span>
                        </td>
                        <td class="py-2.5 px-2 text-center whitespace-nowrap">
                          ${m.turns ? `<span class="inline-block px-2 py-0.5 rounded-md badge-pop-yellow tabular-nums" data-tip="${esc(tr(`Esta partida durou ${m.turns} turno(s).`, `This match lasted ${m.turns} turn(s).`))}">T${m.turns}</span>` : '<span class="text-muted font-bold">—</span>'}
                        </td>
                        <td class="py-2.5 px-2 text-center whitespace-nowrap">
                          <span class="inline-block px-2 py-0.5 rounded-md ${rCls}">${esc(resLabelOf(m.res))}</span>
                        </td>
                        <td class="py-2.5 px-3 leading-relaxed font-medium">
                          <div>${highlightedOpp}</div>
                          ${m.note ? `<div class="mt-1 text-muted italic">${esc(m.note)}</div>` : ''}
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            `)}
          </div>
        ` : renderEmptyState()}
      `;
    }

    // =========================================================================
    // TAB 5: REPORTAR PARTIDA
    // =========================================================================
    let toastTimer = null;
    function showToast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.style.backgroundColor = type === 'error' ? '#D7653A' : '#C8CF7A';
      el.style.color = type === 'error' ? '#F3ECE0' : '#4E3626';
      el.innerHTML = `<span>${type === 'error' ? '!' : '✓'}</span><span>${esc(msg)}</span>`;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
    }

    function copyTextToClipboard(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(successMsg), () => fallbackCopy(text, successMsg));
      } else fallbackCopy(text, successMsg);
    }
    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(successMsg); }
      catch (_) { showToast(tr('Selecione e copie o texto manualmente.', 'Select and copy the text manually.'), 'error'); }
      ta.remove();
    }

    function getDeckLabelFromReport(rep) {
      const d = (rep.deck || '').trim();
      if (!d) return '';
      if (rep.borrowed && !/\(emprestado\)/i.test(d)) return `${d} (emprestado)`;
      return d;
    }

    function formatOpponentsLines(rep) {
      const filled = rep.opponents.filter(o => o.cmd.trim() || o.player.trim());
      const source = filled.length ? filled : rep.opponents;
      return source.map(o => {
        const cmd = o.cmd.trim() || '[Comandante]';
        const pl = o.player.trim();
        const isWin = rep.res === 'D' && o.winner;
        if (pl) return `- ${cmd} (${pl}${isWin ? ' - VENCEDOR' : ''})`;
        if (isWin) return `- ${cmd} (VENCEDOR)`;
        return `- ${cmd}`;
      });
    }

    function formatOppSummary(opponents, res) {
      const filled = opponents.filter(o => o.cmd.trim() || o.player.trim());
      const items = filled.map(o => {
        const cmd = o.cmd.trim() || 'Desconhecido';
        const pl = o.player.trim();
        const isWin = res === 'D' && o.winner;
        if (pl) return `${cmd} (${pl}${isWin ? ' - VENCEDOR' : ''})`;
        if (isWin) return `${cmd} (VENCEDOR)`;
        return cmd;
      });
      if (items.length <= 1) return items[0] || '';
      if (items.length === 2) return `${items[0]} e ${items[1]}`;
      return `${items.slice(0, -1).join(', ')} e ${items[items.length - 1]}`;
    }

    function parseTurnsVal(v) {
      const n = parseInt(String(v ?? '').trim(), 10);
      return Number.isFinite(n) && n >= 1 && n <= 99 ? n : null;
    }

    function buildReportText(rep) {
      const lines = [];
      const fmt = getActiveFormat();
      if (fmt.key !== 'commander') lines.push(`Formato: ${fmt.pt}`);
      if (rep.date) lines.push(`Data: ${fmtDateBr(rep.date)}`);
      lines.push(
        `Mês: ${MONTHS[rep.monthIdx] || 'Novembro'}`,
        `Meu Deck: ${getDeckLabelFromReport(rep) || '[Seu Deck]'}`,
        `Resultado: ${rep.res}`
      );
      if (rep.ordem) lines.push(`Ordem de Jogada: ${rep.ordem}`);
      const tVal = parseTurnsVal(rep.turns);
      if (tVal) lines.push(`Turnos: ${tVal}`);
      lines.push('', 'Oponentes:');
      formatOpponentsLines(rep).forEach(l => lines.push(l));
      lines.push('', 'Notas:');
      if (rep.notes.trim()) lines.push(rep.notes.trim());
      return lines.join('\n');
    }

    function buildReportTextFromMatch(m) {
      const lines = [];
      const fmt = getFormatDef(m.format || 'commander');
      if (fmt.key !== 'commander') lines.push(`Formato: ${fmt.pt}`);
      if (m.date) lines.push(`Data: ${fmtDateBr(m.date)}`);
      lines.push(`Mês: ${m.month}`, `Meu Deck: ${m.deck}`, `Resultado: ${m.res}`);
      if (m.ordem) lines.push(`Ordem de Jogada: ${m.ordem}`);
      if (m.turns) lines.push(`Turnos: ${m.turns}`);
      lines.push('', 'Oponentes:');
      if (m.rawOpponents && m.rawOpponents.length) {
        m.rawOpponents.forEach(o => {
          const isWin = m.res === 'D' && o.winner;
          if (o.player) lines.push(`- ${o.cmd} (${o.player}${isWin ? ' - VENCEDOR' : ''})`);
          else if (isWin) lines.push(`- ${o.cmd} (VENCEDOR)`);
          else lines.push(`- ${o.cmd}`);
        });
      } else lines.push(`- ${m.oppStr}`);
      lines.push('', 'Notas:');
      if (m.note) lines.push(m.note);
      return lines.join('\n');
    }

    function buildSheetsTsv(rep) {
      const resLabel = rep.res === 'V' ? 'Vitória' : (rep.res === 'D' ? 'Derrota' : 'Empate');
      let fullNotes = `Oponentes: ${formatOppSummary(rep.opponents, rep.res)}.`;
      if (rep.notes.trim()) fullNotes += ` Notas: ${rep.notes.trim()}`;
      const tVal = parseTurnsVal(rep.turns);
      return [nextSuggestedId(), MONTHS[rep.monthIdx] || 'Novembro', rep.year || '2026', getDeckLabelFromReport(rep), rep.ordem || '', resLabel, fullNotes, tVal ? String(tVal) : '', rep.date ? fmtDateBr(rep.date) : ''].join('\t');
    }

    function parseOpponentBullet(raw, targetArr) {
      const clean = raw.replace(/^[-•*]\s*/, '').trim();
      if (!clean) return;
      const parenMatch = clean.match(/\(([^)]+)\)\s*$/);
      let cmd = clean, player = '', winner = false;
      if (parenMatch) {
        cmd = clean.slice(0, parenMatch.index).trim();
        const inside = parenMatch[1].trim();
        winner = /vencedor/i.test(inside);
        player = inside.replace(/\s*-?\s*vencedor/i, '').trim();
      }
      targetArr.push({ cmd, player, winner });
    }

    function parseTemplateText(text) {
      const lines = text.replace(/\r\n/g, '\n').split('\n');
      const rep = { date: state.report.date || '', monthIdx: state.report.monthIdx, year: state.report.year || '2026', deck: '', borrowed: false, res: 'V', ordem: '', turns: '', opponents: [], notes: '' };
      let section = 'header';
      const notesLines = [];
      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;
        if (/^formato\s*:/i.test(line)) continue;
        if (/^data\s*:/i.test(line)) {
          const iso = parseDateToIso(line.replace(/^data\s*:/i, '').trim());
          if (iso) {
            rep.date = iso;
            rep.year = iso.slice(0, 4);
            rep.monthIdx = Math.max(0, Math.min(11, parseInt(iso.slice(5, 7), 10) - 1));
          }
          continue;
        }
        if (/^m[eê]s\s*:/i.test(line)) {
          const val = line.replace(/^m[eê]s\s*:/i, '').trim().toLowerCase();
          const idx = MONTHS.findIndex(m => m.toLowerCase().startsWith(val.slice(0, 3)));
          if (idx >= 0) rep.monthIdx = idx;
          continue;
        }
        if (/^(?:meu\s*)?deck\s*:/i.test(line)) {
          const val = line.replace(/^(?:meu\s*)?deck\s*:/i, '').trim();
          rep.borrowed = /\(emprestado\)/i.test(val);
          rep.deck = val;
          continue;
        }
        if (/^resultado\s*:/i.test(line)) {
          const val = line.replace(/^resultado\s*:/i, '').trim().toUpperCase();
          rep.res = val.startsWith('D') ? 'D' : (val.startsWith('E') ? 'E' : 'V');
          continue;
        }
        if (/^ordem(?:\s+de\s+jogada)?\s*:/i.test(line)) {
          rep.ordem = line.replace(/^ordem(?:\s+de\s+jogada)?\s*:/i, '').trim();
          continue;
        }
        if (/^(?:turnos(?:\s+do\s+jogo)?|dura[cç][aã]o(?:\s*\(turnos\)|\s+em\s+turnos)?)\s*:/i.test(line)) {
          const mNum = line.match(/(\d+)/);
          if (mNum) {
            const tv = parseTurnsVal(mNum[1]);
            if (tv) rep.turns = String(tv);
          }
          continue;
        }
        if (/^oponentes?\s*:/i.test(line)) {
          section = 'opponents';
          const inline = line.replace(/^oponentes?\s*:/i, '').trim();
          if (inline) parseOpponentBullet(inline, rep.opponents);
          continue;
        }
        if (/^notas?\s*:/i.test(line)) {
          section = 'notes';
          const inline = line.replace(/^notas?\s*:/i, '').trim();
          if (inline) notesLines.push(inline);
          continue;
        }
        if (section === 'opponents' || line.startsWith('-')) { section = 'opponents'; parseOpponentBullet(line, rep.opponents); }
        else if (section === 'notes') notesLines.push(rawLine.trim());
      }
      if (!rep.opponents.length) rep.opponents = [{ cmd: '', player: '', winner: false }];
      rep.notes = notesLines.join('\n').trim();
      return rep;
    }

    function submitReportToPanel() {
      const rep = state.report;
      const deckName = getDeckLabelFromReport(rep);
      const validOpps = rep.opponents
        .map(o => ({ cmd: o.cmd.trim(), player: o.player.trim(), winner: rep.res === 'D' && !!o.winner }))
        .filter(o => o.cmd || o.player);

      if (!deckName) { showToast(tr('Informe o nome do seu deck.', 'Please enter your deck name.'), 'error'); return; }
      if (!validOpps.length) { showToast(tr('Adicione pelo menos um oponente.', 'Add at least one opponent.'), 'error'); return; }

      const normPlayer = p => (p === 'Josu' ? 'Josué' : (p === 'Matheus' ? 'Mateus' : (p === 'Rafa' ? 'Rafael' : p)));
      const players = [], enemyCmds = [];
      let winnerPlayer = '';
      validOpps.forEach(o => {
        if (o.cmd) enemyCmds.push(o.cmd);
        if (o.player) {
          const np = normPlayer(o.player);
          if (!players.includes(np)) players.push(np);
          if (o.winner) winnerPlayer = np;
        }
      });

      const activeFmt = getActiveFormat();
      const newMatch = {
        n: MATCHES.length + 1,
        id: nextSuggestedId(),
        format: activeFmt.key,
        monthIdx: rep.monthIdx,
        month: MONTHS[rep.monthIdx],
        year: rep.year || '2026',
        date: rep.date || '',
        deckIdx: -1,
        deck: deckName,
        borrowed: deckName.toLowerCase().includes('(emprestado)'),
        res: rep.res,
        resLabel: rep.res === 'V' ? 'Vitória' : (rep.res === 'D' ? 'Derrota' : 'Empate'),
        pod: validOpps.length + 1,
        players, winnerPlayer, enemyCmds,
        ordem: rep.ordem || '',
        turns: parseTurnsVal(rep.turns),
        oppStr: formatOppSummary(validOpps, rep.res),
        note: rep.notes.trim(),
        rawOpponents: validOpps,
        pending: true
      };

      pendingMatches.push(newMatch);
      savePendingMatches(pendingMatches);
      rebuildMatches();
      initFilterSelects();

      const keepCount = rep.opponents.length;
      state.report.deck = '';
      state.report.borrowed = false;
      state.report.ordem = '';

    function exportFilteredCsv() {
      let list = getFilteredMatches();
      if (state.histRes !== 'all') list = list.filter(m => m.res === state.histRes);
      if (state.histSearch.trim()) {
        const q = state.histSearch.trim().toLowerCase();
        list = list.filter(m =>
          m.id.toLowerCase().includes(q) || m.deck.toLowerCase().includes(q) ||
          m.oppStr.toLowerCase().includes(q) || m.note.toLowerCase().includes(q)
        );
      }
      const csvCell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const activeFmt = getActiveFormat();
      const lines = [['ID','Formato','Data','Mês','Ano','Deck','Mesa','Ordem','Turnos','Resultado','Oponentes','Notas'].map(csvCell).join(',')];
      for (const m of list) {
        lines.push([m.id, activeFmt.pt, m.date ? fmtDateBr(m.date) : '', m.month, m.year || '2026', m.deck, m.pod + 'P', m.ordem, m.turns || '', m.resLabel, m.oppStr, m.note].map(csvCell).join(','));
      }
      const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.format}-match-tracker-filtrado.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function exportStandaloneHtml() {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelectorAll('style').forEach(s => {
        if (s.id !== 'cmt-base-style') s.remove();
      });
      ['kpi-strip', 'view-root', 'active-filter-chips', 'f-month', 'f-deck', 'f-player'].forEach(id => {
        const el = clone.querySelector('#' + id);
        if (el) el.innerHTML = '';
      });
      const tipEl = clone.querySelector('#tooltip');
      if (tipEl) { tipEl.classList.add('hidden'); tipEl.innerHTML = ''; }
      const toastEl = clone.querySelector('#toast');
      if (toastEl) { toastEl.classList.add('hidden'); toastEl.innerHTML = ''; }
      const qsEl = clone.querySelector('#quick-search');
      if (qsEl) qsEl.setAttribute('value', '');

      const scriptEl = clone.querySelector('#cmt-app-script');
      if (scriptEl) {
        const safeJson = obj => JSON.stringify(obj).replace(/<\//g, '<\\/');
        const favsJson = safeJson(Array.from(favoriteDecks));
        const stylesJson = safeJson(deckStyles);
        const metaJson = safeJson(deckMeta);
        const langJson = safeJson(state.lang);
        scriptEl.textContent = scriptEl.textContent
          .replace(/\/\*CMT_FAVS_START\*\/[\s\S]*?\/\*CMT_FAVS_END\*\//, `/*CMT_FAVS_START*/${favsJson}/*CMT_FAVS_END*/`)
          .replace(/\/\*CMT_STYLES_START\*\/[\s\S]*?\/\*CMT_STYLES_END\*\//, `/*CMT_STYLES_START*/${stylesJson}/*CMT_STYLES_END*/`)
          .replace(/\/\*CMT_META_START\*\/[\s\S]*?\/\*CMT_META_END\*\//, `/*CMT_META_START*/${metaJson}/*CMT_META_END*/`)
          .replace(/\/\*CMT_LANG_START\*\/[\s\S]*?\/\*CMT_LANG_END\*\//, `/*CMT_LANG_START*/${langJson}/*CMT_LANG_END*/`);
      }

      const htmlDoc = '<!DOCTYPE html>\n' + clone.outerHTML;
      const blob = new Blob([htmlDoc], { type: 'text/html;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'commander-match-tracker.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast(tr('Arquivo commander-match-tracker.html baixado!', 'commander-match-tracker.html downloaded!'));
    }

    // =========================================================================
    // MASTER RENDER & EVENT DELEGATION
    // =========================================================================
    function render(preserveFocusId = null) {
      let selStart = null, selEnd = null;
      if (preserveFocusId) {
        const el = document.getElementById(preserveFocusId);
        if (el) { selStart = el.selectionStart; selEnd = el.selectionEnd; }
      }

      syncFilterControls();
      const filtered = getFilteredMatches();
      renderKPIs(filtered);

      const kpiStrip = document.getElementById('kpi-strip');
      if (kpiStrip) kpiStrip.classList.toggle('hidden', state.tab !== 'overview' || MATCHES.length === 0);

      const filterBar = document.getElementById('global-filter-bar');
      if (filterBar) filterBar.classList.toggle('hidden', state.tab === 'report' || MATCHES.length === 0);

      const fmtPendingCount = getFormatPendingMatches().length;
      const pBadge = document.getElementById('pending-tab-badge');
      if (pBadge) {
        pBadge.textContent = String(fmtPendingCount);
        pBadge.classList.toggle('hidden', fmtPendingCount === 0);
      }

      const root = document.getElementById('view-root');
      if (state.tab === 'overview') root.innerHTML = renderOverview(filtered);
      else if (state.tab === 'decks') root.innerHTML = renderDecks(filtered);
      else if (state.tab === 'opponents') root.innerHTML = renderOpponents(filtered);
      else if (state.tab === 'history') root.innerHTML = renderHistory(filtered);
      else root.innerHTML = renderReport();

      normalizeNativeTitles(document);
      requestAnimationFrame(initTableScrollbars);

      if (preserveFocusId) {
        const el = document.getElementById(preserveFocusId);
        if (el) {
          el.focus();
          if (selStart !== null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd);
        }
      }
    }

    function resetAllFilters() {
      state.onlyFavorites = false;
      state.quickSearch = '';
      state.month = 'all';
      state.deck = 'all';
      state.player = 'all';
      state.pod = 'all';
      state.origin = 'all';
      state.enemyCmdFilter = '';
      state.histSearch = '';
      state.histRes = 'all';
      render();
    }

    function scrollToSection(id) {
      requestAnimationFrame(() => {
        const el = document.getElementById(id);
        if (!el) return;
        const rect = el.getBoundingClientRect();
        if (rect.top < 0 || rect.top > 48) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        const card = el.querySelector('.nb-card');
        if (card) {
          card.classList.remove('xray-flash');
          void card.offsetWidth;
          card.classList.add('xray-flash');
        }
      });
    }

    document.getElementById('f-month').addEventListener('change', e => { state.month = e.target.value; render(); });
    document.getElementById('f-deck').addEventListener('change', e => { state.deck = e.target.value; render(); });
    document.getElementById('f-player').addEventListener('change', e => { state.player = e.target.value; render(); });
    document.getElementById('btn-reset-filters').addEventListener('click', resetAllFilters);

    document.addEventListener('click', e => {
      // MTG Format dropdown toggle & selection
      const fmtBtn = e.target.closest('#btn-format-menu');
      if (fmtBtn) {
        state.formatMenuOpen = !state.formatMenuOpen;
        if (state.formatMenuOpen) state.langMenuOpen = false;
        syncStaticI18n();
        return;
      }
      const setFmtBtn = e.target.closest('[data-set-format]');
      if (setFmtBtn) {
        const nextFmt = setFmtBtn.dataset.setFormat;
        if (MTG_FORMATS.some(f => f.key === nextFmt)) {
          const changed = nextFmt !== state.format;
          activeFormatKey = nextFmt;
          state.format = nextFmt;
          saveFormat(nextFmt);
          state.formatMenuOpen = false;
          if (changed) {
            state.month = 'all';
            state.deck = 'all';
            state.player = 'all';
            state.pod = 'all';
            state.origin = 'all';
            state.onlyFavorites = false;
            state.quickSearch = '';
            state.enemyCmdFilter = '';
            state.selectedDeck = null;
            state.selectedPlayer = null;
            state.showDeckCustomizer = false;
            state.showDeckMetaEditor = false;
            state.showDeckCmdEditor = false;
            state.cmdDraft = null;
            state.deckSearch = '';
            state.oppSearch = '';
            state.histSearch = '';
            state.histRes = 'all';
            const chosen = getActiveFormat();
            const isRepBlank = !state.report.deck.trim() && state.report.opponents.every(o => !o.cmd.trim() && !o.player.trim());
            if (isRepBlank) {
              state.report.opponents = Array.from({ length: chosen.defaultOpps || 1 }, () => ({ cmd: '', player: '', winner: false }));
            }
            rebuildMatches();
            initFilterSelects();
            render();
            showToast(tr(`Perfil alterado para ${chosen.pt} (${MATCHES.length} partidas)`, `Switched to ${chosen.en} profile (${MATCHES.length} matches)`));
          } else {
            syncStaticI18n();
          }
        } else {
          state.formatMenuOpen = false;
          syncStaticI18n();
        }
        return;
      }
      if (state.formatMenuOpen && !e.target.closest('#format-menu-wrap')) {
        state.formatMenuOpen = false;
        syncStaticI18n();
      }

      // Language dropdown toggle & selection
      const langBtn = e.target.closest('#btn-lang-menu');
      if (langBtn) {
        state.langMenuOpen = !state.langMenuOpen;
        if (state.langMenuOpen) state.formatMenuOpen = false;
        syncStaticI18n();
        return;
      }
      const setLangBtn = e.target.closest('[data-set-lang]');
      if (setLangBtn) {
        const nextLang = setLangBtn.dataset.setLang === 'en' ? 'en' : 'pt';
        state.lang = nextLang;
        state.langMenuOpen = false;
        saveLang(nextLang);
        initFilterSelects();
        render();
        showToast(nextLang === 'en' ? 'Language switched to English' : 'Idioma alterado para Português (BR)');
        return;
      }
      if (state.langMenuOpen && !e.target.closest('#lang-menu-wrap')) {
        state.langMenuOpen = false;
        syncStaticI18n();
      }

      // Let outbound hyperlinks (Scryfall / Decklist) open without triggering row/card selection
      if (e.target.closest('a[href]')) return;

      // Favorite star toggle MUST be handled before card/row navigation
      const toggleFav = e.target.closest('[data-toggle-fav]');
      if (toggleFav) {
        toggleFavoriteDeck(toggleFav.dataset.toggleFav);
        render();
        return;
      }

      if (e.target.closest('#btn-toggle-fav-filter') || e.target.closest('[data-toggle-fav-filter]')) {
        state.onlyFavorites = !state.onlyFavorites;
        render();
        return;
      }

      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) { state.tab = tabBtn.dataset.tab; render(); return; }

      const gotoTab = e.target.closest('[data-goto-tab]');
      if (gotoTab) { state.tab = gotoTab.dataset.gotoTab; render(); return; }

      if (e.target.closest('#btn-toggle-filters')) { state.showFilters = !state.showFilters; render(); return; }

      const podBtn = e.target.closest('.pod-pill');
      if (podBtn) { state.pod = podBtn.dataset.pod; render(); return; }

      const origBtn = e.target.closest('.origin-pill');
      if (origBtn) { state.origin = origBtn.dataset.origin; render(); return; }

      const clearChip = e.target.closest('[data-clear-filter]');
      if (clearChip) {
        const k = clearChip.dataset.clearFilter;
        if (k === 'onlyFavorites') state.onlyFavorites = false;
        else state[k] = (k === 'enemyCmdFilter' || k === 'quickSearch') ? '' : 'all';
        render();
        return;
      }

      if (e.target.id === 'btn-empty-reset') { resetAllFilters(); return; }

      const clickMonth = e.target.closest('[data-click-month]');
      if (clickMonth) {
        const m = clickMonth.dataset.clickMonth;
        state.month = state.month === m ? 'all' : m;
        render();
        return;
      }
      const clickPod = e.target.closest('[data-click-pod]');
      if (clickPod) {
        const p = clickPod.dataset.clickPod;
        state.pod = state.pod === p ? 'all' : p;
        render();
        return;
      }

      const jumpDeck = e.target.closest('[data-jump-deck]');
      if (jumpDeck) {
        state.selectedDeck = jumpDeck.dataset.jumpDeck;
        state.showDeckMetaEditor = false;
        state.showDeckCmdEditor = false;
        state.cmdDraft = null;
        state.deckMinGames = 1;
        state.tab = 'decks';
        render();
        scrollToSection('deck-xray');
        return;
      }

      const filterDeck = e.target.closest('[data-filter-deck]');
      if (filterDeck) { state.deck = filterDeck.dataset.filterDeck; render(); return; }

      if (e.target.closest('[data-toggle-customizer]')) {
        state.showDeckCustomizer = !state.showDeckCustomizer;
        render();
        return;
      }

      const toggleCmdBtn = e.target.closest('[data-toggle-cmd-editor]');
      if (toggleCmdBtn) {
        const dk = toggleCmdBtn.dataset.toggleCmdEditor;
        if (state.showDeckCmdEditor) {
          state.showDeckCmdEditor = false;
          state.cmdDraft = null;
        } else {
          const info = getDeckCommanderInfo(dk);
          const cols = getDeckColorIdentity(dk);
          state.showDeckCmdEditor = true;
          state.cmdDraft = { deck: dk, partner: info.partner, cmd1: info.cmd1, cmd2: info.cmd2, colors: cols.slice() };
        }
        render();
        return;
      }

      const toggleCmdColorBtn = e.target.closest('[data-toggle-cmd-color]');
      if (toggleCmdColorBtn && state.cmdDraft) {
        const code = toggleCmdColorBtn.dataset.toggleCmdColor;
        state.cmdDraft.cmd1 = document.getElementById('deck-cmd-1')?.value ?? state.cmdDraft.cmd1;
        const inp2 = document.getElementById('deck-cmd-2');
        if (inp2) state.cmdDraft.cmd2 = inp2.value;
        const cur = new Set(state.cmdDraft.colors || []);
        if (cur.has(code)) cur.delete(code);
        else cur.add(code);
        state.cmdDraft.colors = MANA_ORDER.filter(c => cur.has(c));
        render();
        return;
      }

      if (e.target.closest('[data-toggle-cmd-partner]')) {
        if (state.cmdDraft) {
          state.cmdDraft.cmd1 = document.getElementById('deck-cmd-1')?.value ?? state.cmdDraft.cmd1;
          const inp2 = document.getElementById('deck-cmd-2');
          if (inp2) state.cmdDraft.cmd2 = inp2.value;
          state.cmdDraft.partner = !state.cmdDraft.partner;
          render();
        }
        return;
      }

      const saveCmdBtn = e.target.closest('[data-save-deck-cmd]');
      if (saveCmdBtn) {
        const dk = saveCmdBtn.dataset.saveDeckCmd;
        const partner = Boolean(state.cmdDraft && state.cmdDraft.partner);
        const cmd1 = (document.getElementById('deck-cmd-1')?.value || '').trim();
        const cmd2 = partner ? (document.getElementById('deck-cmd-2')?.value || '').trim() : '';
        if (!cmd1) {
          showToast(tr('Informe o nome do comandante.', 'Please enter the commander name.'), 'error');
          return;
        }
        if (partner && !cmd2) {
          showToast(tr('Informe o nome do 2º comandante ou desligue a opção Partner.', 'Enter the 2nd commander name or turn off Partner.'), 'error');
          return;
        }
        const colors = MANA_ORDER.filter(c => (state.cmdDraft?.colors || []).includes(c));
        deckMeta[dk] = { ...(deckMeta[dk] || {}), cmdCustom: true, partner, cmd1, cmd2, colorsCustom: true, colors };
        saveDeckMeta(deckMeta);
        state.showDeckCmdEditor = false;
        state.cmdDraft = null;
        initFilterSelects();
        render();
        showToast(partner ? tr('Comandantes Partner salvos!', 'Partner commanders saved!') : tr('Comandante atualizado!', 'Commander updated!'));
        return;
      }

      const resetCmdBtn = e.target.closest('[data-reset-deck-cmd]');
      if (resetCmdBtn) {
        const dk = resetCmdBtn.dataset.resetDeckCmd;
        if (deckMeta[dk]) {
          delete deckMeta[dk].cmdCustom;
          delete deckMeta[dk].partner;
          delete deckMeta[dk].cmd1;
          delete deckMeta[dk].cmd2;
          delete deckMeta[dk].colorsCustom;
          delete deckMeta[dk].colors;
          pruneDeckMetaEntry(dk);
          saveDeckMeta(deckMeta);
        }
        state.showDeckCmdEditor = false;
        state.cmdDraft = null;
        initFilterSelects();
        render();
        showToast(tr('Comandante restaurado para o padrão.', 'Commander reset to default.'));
        return;
      }

      if (e.target.closest('[data-toggle-deck-meta]')) {
        state.showDeckMetaEditor = !state.showDeckMetaEditor;
        render();
        return;
      }

      if (e.target.closest('[data-deck-meta-today]')) {
        const inp = document.getElementById('deck-meta-date');
        if (inp) inp.value = todayIso();
        return;
      }

      if (e.target.closest('[data-deck-meta-clear-date]')) {
        const inp = document.getElementById('deck-meta-date');
        if (inp) inp.value = '';
        return;
      }

      const saveMetaBtn = e.target.closest('[data-save-deck-meta]');
      if (saveMetaBtn) {
        const dk = saveMetaBtn.dataset.saveDeckMeta;
        const rawUrl = (document.getElementById('deck-meta-url')?.value || '').trim();
        const url = sanitizeDeckUrl(rawUrl);
        if (rawUrl && !url) {
          showToast(tr('Link inválido. Use um endereço como https://moxfield.com/...', 'Invalid URL. Use a link like https://moxfield.com/...'), 'error');
          return;
        }
        const lastUpdated = (document.getElementById('deck-meta-date')?.value || '').trim();
        const note = (document.getElementById('deck-meta-note')?.value || '').trim();
        deckMeta[dk] = { ...(deckMeta[dk] || {}), url, lastUpdated, note };
        pruneDeckMetaEntry(dk);
        saveDeckMeta(deckMeta);
        state.showDeckMetaEditor = false;
        render();
        showToast(tr('Decklist e data de mudança salvas!', 'Decklist and update date saved!'));
        return;
      }

      const setIconBtn = e.target.closest('[data-set-deck-icon]');
      if (setIconBtn) {
        const dk = setIconBtn.dataset.styleDeck;
        const val = setIconBtn.dataset.setDeckIcon;
        if (!deckStyles[dk]) deckStyles[dk] = {};
        if (val === 'auto') delete deckStyles[dk].icon;
        else deckStyles[dk].icon = val;
        if (!deckStyles[dk].icon && !deckStyles[dk].color) delete deckStyles[dk];
        saveDeckStyles(deckStyles);
        render();
        return;
      }

      const setColorBtn = e.target.closest('[data-set-deck-color]');
      if (setColorBtn) {
        const dk = setColorBtn.dataset.styleDeck;
        const val = setColorBtn.dataset.setDeckColor;
        if (!deckStyles[dk]) deckStyles[dk] = {};
        if (val === 'auto') delete deckStyles[dk].color;
        else deckStyles[dk].color = val;
        if (!deckStyles[dk].icon && !deckStyles[dk].color) delete deckStyles[dk];
        saveDeckStyles(deckStyles);
        render();
        return;
      }

      const resetStyleBtn = e.target.closest('[data-reset-deck-style]');
      if (resetStyleBtn) {
        delete deckStyles[resetStyleBtn.dataset.resetDeckStyle];
        saveDeckStyles(deckStyles);
        render();
        showToast(tr('Estilo restaurado para o modo automático.', 'Style reset to automatic mode.'));
        return;
      }

      const rivalHist = e.target.closest('[data-rival-history]');
      if (rivalHist) {
        const pl = rivalHist.dataset.rivalHistory;
        state.player = pl;
        state.selectedPlayer = pl;
        state.tab = 'history';
        render();
        return;
      }

      const jumpRival = e.target.closest('[data-jump-rival]');
      if (jumpRival) {
        const pl = jumpRival.dataset.jumpRival;
        state.selectedPlayer = pl;
        state.oppSubTab = 'players';
        state.tab = 'opponents';
        render();
        scrollToSection('rival-xray');
        return;
      }

      const selPlayer = e.target.closest('[data-select-player]');
      if (selPlayer) {
        state.selectedPlayer = selPlayer.dataset.selectPlayer;
        render();
        scrollToSection('rival-xray');
        return;
      }

      const jumpPlayer = e.target.closest('[data-jump-player]');
      if (jumpPlayer) {
        const pl = jumpPlayer.dataset.jumpPlayer;
        state.player = state.player === pl ? 'all' : pl;
        render();
        return;
      }

      const selDeck = e.target.closest('[data-select-deck]');
      if (selDeck) {
        state.selectedDeck = selDeck.dataset.selectDeck;
        state.showDeckMetaEditor = false;
        state.showDeckCmdEditor = false;
        state.cmdDraft = null;
        render();
        scrollToSection('deck-xray');
        return;
      }

      const deckViewBtn = e.target.closest('[data-deck-view]');
      if (deckViewBtn) { state.deckView = deckViewBtn.dataset.deckView; render(); return; }

      const minG = e.target.closest('[data-min-games]');
      if (minG) { state.deckMinGames = Number(minG.dataset.minGames); render(); return; }

      const oppSub = e.target.closest('[data-opp-sub]');
      if (oppSub) { state.oppSubTab = oppSub.dataset.oppSub; state.oppSearch = ''; render(); return; }

      const filterEcmd = e.target.closest('[data-filter-ecmd]');
      if (filterEcmd) {
        state.enemyCmdFilter = filterEcmd.dataset.filterEcmd;
        if (filterEcmd.dataset.filterEcmdPlayer) state.player = filterEcmd.dataset.filterEcmdPlayer;
        state.tab = 'history';
        render();
        return;
      }

      const hmCell = e.target.closest('[data-heatmap-deck]');
      if (hmCell) {
        state.deck = hmCell.dataset.heatmapDeck;
        state.player = hmCell.dataset.heatmapPlayer;
        state.tab = 'history';
        render();
        return;
      }

      const histRes = e.target.closest('[data-hist-res]');
      if (histRes) { state.histRes = histRes.dataset.histRes; render(); return; }

      if (e.target.id === 'btn-hist-order') { state.histOrder = state.histOrder === 'desc' ? 'asc' : 'desc'; render(); return; }
      if (e.target.id === 'btn-export-csv') { exportFilteredCsv(); return; }

      // Report actions
      const repRes = e.target.closest('[data-rep-res]');
      if (repRes) {
        state.report.res = repRes.dataset.repRes;
        if (state.report.res !== 'D') state.report.opponents.forEach(o => { o.winner = false; });
        render();
        return;
      }
      const repOrdem = e.target.closest('[data-rep-ordem]');
      if (repOrdem) { state.report.ordem = repOrdem.dataset.repOrdem; render(); return; }

      const repTurns = e.target.closest('[data-rep-turns]');
      if (repTurns) { state.report.turns = repTurns.dataset.repTurns; render(); return; }

      if (e.target.id === 'btn-rep-date-today') {
        const iso = todayIso();
        state.report.date = iso;
        state.report.year = iso.slice(0, 4);
        state.report.monthIdx = parseInt(iso.slice(5, 7), 10) - 1;
        render();
        return;
      }
      if (e.target.id === 'btn-rep-date-clear') {
        state.report.date = '';
        render();
        return;
      }

      const repPreset = e.target.closest('[data-rep-preset]');
      if (repPreset) {
        const len = Number(repPreset.dataset.repPreset);
        while (state.report.opponents.length < len) state.report.opponents.push({ cmd: '', player: '', winner: false });
        if (state.report.opponents.length > len) state.report.opponents = state.report.opponents.slice(0, len);
        render();
        return;
      }
      const oppWin = e.target.closest('[data-opp-winner]');
      if (oppWin && state.report.res === 'D') {
        const idx = Number(oppWin.dataset.oppWinner);
        const already = state.report.opponents[idx].winner;
        state.report.opponents.forEach((o, i) => { o.winner = i === idx ? !already : false; });
        render();
        return;
      }
      const oppRem = e.target.closest('[data-opp-remove]');
      if (oppRem && state.report.opponents.length > 1) {
        state.report.opponents.splice(Number(oppRem.dataset.oppRemove), 1);
        render();
        return;
      }
      if (e.target.id === 'btn-add-opp') { state.report.opponents.push({ cmd: '', player: '', winner: false }); render(); return; }
      if (e.target.id === 'btn-toggle-paste') { state.report.showPasteBox = !state.report.showPasteBox; render(); return; }
      if (e.target.id === 'btn-parse-paste') {
        const parsed = parseTemplateText(state.report.pasteText || '');
        state.report = { ...state.report, ...parsed, showPasteBox: false, pasteText: '' };
        render();
        showToast(tr('Formulário preenchido!', 'Form filled!'));
        return;
      }
      if (e.target.id === 'btn-clear-report') {
        state.report.deck = ''; state.report.borrowed = false; state.report.res = 'V';
        state.report.ordem = ''; state.report.turns = ''; state.report.notes = '';
        state.report.opponents = [{ cmd: '', player: '', winner: false }, { cmd: '', player: '', winner: false }, { cmd: '', player: '', winner: false }];
        render();
        return;
      }
      if (e.target.id === 'btn-submit-report') { submitReportToPanel(); return; }
      if (e.target.id === 'btn-copy-current-report' || e.target.id === 'btn-copy-preview') {
        copyTextToClipboard(buildReportText(state.report), tr('Report copiado! Cole no chat para gravar na planilha.', 'Report copied! Paste in chat to save to Sheets.'));
        return;
      }
      if (e.target.id === 'btn-copy-tsv') { copyTextToClipboard(buildSheetsTsv(state.report), tr('Linha TSV copiada!', 'TSV row copied!')); return; }
      if (e.target.id === 'btn-copy-all-pending') {
        const fmtPend = getFormatPendingMatches();
        copyTextToClipboard(fmtPend.map(buildReportTextFromMatch).join('\n\n---\n\n'), tr(`${fmtPend.length} report(s) copiado(s)!`, `${fmtPend.length} report(s) copied!`));
        return;
      }
      const copyPend = e.target.closest('[data-copy-pending-id]');
      if (copyPend) {
        const pid = copyPend.dataset.copyPendingId;
        const m = pendingMatches.find(x => x.id === pid && (x.format || 'commander') === state.format);
        if (m) copyTextToClipboard(buildReportTextFromMatch(m), tr(`Report da ${m.id} copiado!`, `Report for ${m.id} copied!`));
        return;
      }
      const remPend = e.target.closest('[data-remove-pending-id]');
      if (remPend) {
        const pid = remPend.dataset.removePendingId;
        const idx = pendingMatches.findIndex(x => x.id === pid && (x.format || 'commander') === state.format);
        if (idx >= 0) {
          const removed = pendingMatches.splice(idx, 1)[0];
          savePendingMatches(pendingMatches);
          rebuildMatches();
          initFilterSelects();
          render();
          if (removed) showToast(tr(`${removed.id} removida da fila local.`, `${removed.id} removed from local queue.`));
        }
        return;
      }
    });

    document.addEventListener('input', e => {
      if (e.target.id === 'quick-search') { state.quickSearch = e.target.value; render('quick-search'); }
      else if (e.target.id === 'deck-search') { state.deckSearch = e.target.value; render('deck-search'); }
      else if (e.target.id === 'opp-search') { state.oppSearch = e.target.value; render('opp-search'); }
      else if (e.target.id === 'hist-search') { state.histSearch = e.target.value; render('hist-search'); }
      else if (e.target.id === 'deck-cmd-1') { if (state.cmdDraft) state.cmdDraft.cmd1 = e.target.value; }
      else if (e.target.id === 'deck-cmd-2') { if (state.cmdDraft) state.cmdDraft.cmd2 = e.target.value; }
      else if (e.target.id === 'rep-deck') { state.report.deck = e.target.value; updateReportPreviewLive(); }
      else if (e.target.id === 'rep-turns') {
        state.report.turns = e.target.value;
        document.querySelectorAll('[data-rep-turns]').forEach(btn => {
          btn.classList.toggle('nb-pill-active', btn.dataset.repTurns === String(state.report.turns).trim());
        });
        updateReportPreviewLive();
      }
      else if (e.target.id === 'rep-notes') { state.report.notes = e.target.value; updateReportPreviewLive(); }
      else if (e.target.id === 'rep-paste-area') { state.report.pasteText = e.target.value; }
      else if (e.target.dataset && e.target.dataset.oppField) {
        const idx = Number(e.target.dataset.oppIdx);
        if (state.report.opponents[idx]) {
          state.report.opponents[idx][e.target.dataset.oppField] = e.target.value;
          updateReportPreviewLive();
        }
      }
    });

    document.addEventListener('change', e => {
      if (e.target.id === 'deck-sort') { state.deckSort = e.target.value; render(); }
      else if (e.target.id === 'rep-date') {
        const iso = e.target.value;
        state.report.date = iso;
        if (iso && /^\d{4}-\d{2}-\d{2}$/.test(iso)) {
          state.report.year = iso.slice(0, 4);
          state.report.monthIdx = parseInt(iso.slice(5, 7), 10) - 1;
        }
        render();
      }
      else if (e.target.id === 'rep-month') {
        state.report.monthIdx = Number(e.target.value);
        if (state.report.date && parseInt(state.report.date.slice(5, 7), 10) - 1 !== state.report.monthIdx) {
          state.report.date = '';
        }
        render();
      }
      else if (e.target.id === 'rep-borrowed') { state.report.borrowed = e.target.checked; updateReportPreviewLive(); }
    });

    window.addEventListener('resize', () => requestAnimationFrame(initTableScrollbars), { passive: true });
    rebuildMatches();
    initFilterSelects();
    render();
  </script>
</body>
</html>
