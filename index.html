    function renderEmptyState() {
      if (state.onlyFavorites && favoriteDecks.size === 0) {
        return `
          <div class="nb-card p-10 text-center space-y-3">
            <div class="text-base font-black">Nenhum deck favoritado ainda ★</div>
            <p class="text-xs font-medium text-muted">Clique na estrela <strong>☆</strong> em qualquer pasta ou linha de deck para marcá-lo como favorito.</p>
            <button id="btn-empty-reset" class="nb-btn nb-btn-yellow px-4 py-2 text-xs">Voltar a mostrar todos os decks</button>
          </div>
        `;
      }
      return `
        <div class="nb-card p-10 text-center space-y-3">
          <div class="text-base font-black">Nenhuma partida encontrada para esses filtros</div>
          <p class="text-xs font-medium text-muted">Ajuste os filtros ou limpe a busca para voltar a ver os dados.</p>
          <button id="btn-empty-reset" class="nb-btn nb-btn-yellow px-4 py-2 text-xs">Limpar todos os filtros</button>
        </div>
      `;
    }

    function exportFilteredCsv() {
      let list = getFilteredMatches();
      if (state.histRes !== 'all') list = list.filter(m => m.res === state.histRes);
      if (state.histSearch.trim()) {
        const q = state.histSearch.trim().toLowerCase();
        list = list.filter(m =>
          m.id.toLowerCase().includes(q) || m.deck.toLowerCase().includes(q) ||
          m.oppStr.toLowerCase().includes(q) || m.note.toLowerCase().includes(q)
        );
      }
      const csvCell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const lines = [['ID','Mês','Ano','Deck','Mesa','Ordem','Resultado','Oponentes','Notas'].map(csvCell).join(',')];
      for (const m of list) {
        lines.push([m.id, m.month, '2026', m.deck, m.pod + 'P', m.ordem, m.resLabel, m.oppStr, m.note].map(csvCell).join(','));
      }
      const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'commander-match-tracker-filtrado.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function exportStandaloneHtml() {
      const clone = document.documentElement.cloneNode(true);
      clone.querySelectorAll('style').forEach(s => {
        if (s.id !== 'cmt-base-style') s.remove();
      });
      ['kpi-strip', 'view-root', 'active-filter-chips', 'f-month', 'f-deck', 'f-player'].forEach(id => {
        const el = clone.querySelector('#' + id);
        if (el) el.innerHTML = '';
      });
      const tipEl = clone.querySelector('#tooltip');
      if (tipEl) { tipEl.classList.add('hidden'); tipEl.innerHTML = ''; }
      const toastEl = clone.querySelector('#toast');
      if (toastEl) { toastEl.classList.add('hidden'); toastEl.innerHTML = ''; }
      const qsEl = clone.querySelector('#quick-search');
      if (qsEl) qsEl.setAttribute('value', '');

      const scriptEl = clone.querySelector('#cmt-app-script');
      if (scriptEl) {
        const safeJson = obj => JSON.stringify(obj).replace(/<\//g, '<\\/');
        const favsJson = safeJson(Array.from(favoriteDecks));
        const stylesJson = safeJson(deckStyles);
        scriptEl.textContent = scriptEl.textContent
          .replace(/\/\*CMT_FAVS_START\*\/[\s\S]*?\/\*CMT_FAVS_END\*\//, `/*CMT_FAVS_START*/${favsJson}/*CMT_FAVS_END*/`)
          .replace(/\/\*CMT_STYLES_START\*\/[\s\S]*?\/\*CMT_STYLES_END\*\//, `/*CMT_STYLES_START*/${stylesJson}/*CMT_STYLES_END*/`);
      }

      const htmlDoc = '<!DOCTYPE html>\n' + clone.outerHTML;
      const blob = new Blob([htmlDoc], { type: 'text/html;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'commander-match-tracker.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Arquivo commander-match-tracker.html baixado!');
    }

    // =========================================================================
    // MASTER RENDER & EVENT DELEGATION
    // =========================================================================
    function render(preserveFocusId = null) {
      let selStart = null, selEnd = null;
      if (preserveFocusId) {
        const el = document.getElementById(preserveFocusId);
        if (el) { selStart = el.selectionStart; selEnd = el.selectionEnd; }
      }

      syncFilterControls();
      const filtered = getFilteredMatches();
      renderKPIs(filtered);

      const kpiStrip = document.getElementById('kpi-strip');
      if (kpiStrip) kpiStrip.classList.toggle('hidden', state.tab !== 'overview');

      const filterBar = document.getElementById('global-filter-bar');
      if (filterBar) filterBar.classList.toggle('hidden', state.tab === 'report');

      const pBadge = document.getElementById('pending-tab-badge');
      if (pBadge) {
        pBadge.textContent = String(pendingMatches.length);
        pBadge.classList.toggle('hidden', pendingMatches.length === 0);
      }

      const root = document.getElementById('view-root');
      if (state.tab === 'overview') root.innerHTML = renderOverview(filtered);
      else if (state.tab === 'decks') root.innerHTML = renderDecks(filtered);
      else if (state.tab === 'opponents') root.innerHTML = renderOpponents(filtered);
      else if (state.tab === 'history') root.innerHTML = renderHistory(filtered);
      else root.innerHTML = renderReport();

      normalizeNativeTitles(document);

      if (preserveFocusId) {
        const el = document.getElementById(preserveFocusId);
        if (el) {
          el.focus();
          if (selStart !== null && el.setSelectionRange) el.setSelectionRange(selStart, selEnd);
        }
      }
    }

    function resetAllFilters() {
      state.onlyFavorites = false;
      state.quickSearch = '';
      state.month = 'all';
      state.deck = 'all';
      state.player = 'all';
      state.pod = 'all';
      state.origin = 'all';
      state.enemyCmdFilter = '';
      state.histSearch = '';
      state.histRes = 'all';
      render();
    }

    function scrollToSection(id) {
      requestAnimationFrame(() => {
        const el = document.getElementById(id);
        if (!el) return;
        const rect = el.getBoundingClientRect();
        if (rect.top < 0 || rect.top > 48) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        const card = el.querySelector('.nb-card');
        if (card) {
          card.classList.remove('xray-flash');
          void card.offsetWidth;
          card.classList.add('xray-flash');
        }
      });
    }

    document.getElementById('f-month').addEventListener('change', e => { state.month = e.target.value; render(); });
    document.getElementById('f-deck').addEventListener('change', e => { state.deck = e.target.value; render(); });
    document.getElementById('f-player').addEventListener('change', e => { state.player = e.target.value; render(); });
    document.getElementById('btn-reset-filters').addEventListener('click', resetAllFilters);

    document.addEventListener('click', e => {
      // Favorite star toggle MUST be handled before card/row navigation
      const toggleFav = e.target.closest('[data-toggle-fav]');
      if (toggleFav) {
        toggleFavoriteDeck(toggleFav.dataset.toggleFav);
        render();
        return;
      }

      if (e.target.closest('#btn-toggle-fav-filter') || e.target.closest('[data-toggle-fav-filter]')) {
        state.onlyFavorites = !state.onlyFavorites;
        render();
        return;
      }

      const tabBtn = e.target.closest('[data-tab]');
      if (tabBtn) { state.tab = tabBtn.dataset.tab; render(); return; }

      const gotoTab = e.target.closest('[data-goto-tab]');
      if (gotoTab) { state.tab = gotoTab.dataset.gotoTab; render(); return; }

      if (e.target.closest('#btn-download-html')) { exportStandaloneHtml(); return; }

      if (e.target.closest('#btn-toggle-filters')) { state.showFilters = !state.showFilters; render(); return; }

      const podBtn = e.target.closest('.pod-pill');
      if (podBtn) { state.pod = podBtn.dataset.pod; render(); return; }

      const origBtn = e.target.closest('.origin-pill');
      if (origBtn) { state.origin = origBtn.dataset.origin; render(); return; }

      const clearChip = e.target.closest('[data-clear-filter]');
      if (clearChip) {
        const k = clearChip.dataset.clearFilter;
        if (k === 'onlyFavorites') state.onlyFavorites = false;
        else state[k] = (k === 'enemyCmdFilter' || k === 'quickSearch') ? '' : 'all';
        render();
        return;
      }

      if (e.target.id === 'btn-empty-reset') { resetAllFilters(); return; }

      const clickMonth = e.target.closest('[data-click-month]');
      if (clickMonth) {
        const m = clickMonth.dataset.clickMonth;
        state.month = state.month === m ? 'all' : m;
        render();
        return;
      }
      const clickPod = e.target.closest('[data-click-pod]');
      if (clickPod) {
        const p = clickPod.dataset.clickPod;
        state.pod = state.pod === p ? 'all' : p;
        render();
        return;
      }

      const jumpDeck = e.target.closest('[data-jump-deck]');
      if (jumpDeck) {
        state.selectedDeck = jumpDeck.dataset.jumpDeck;
        state.deckMinGames = 1;
        state.tab = 'decks';
        render();
        scrollToSection('deck-xray');
        return;
      }

      const filterDeck = e.target.closest('[data-filter-deck]');
      if (filterDeck) { state.deck = filterDeck.dataset.filterDeck; render(); return; }

      if (e.target.closest('[data-toggle-customizer]')) {
        state.showDeckCustomizer = !state.showDeckCustomizer;
        render();
        return;
      }

      const setIconBtn = e.target.closest('[data-set-deck-icon]');
      if (setIconBtn) {
        const dk = setIconBtn.dataset.styleDeck;
        const val = setIconBtn.dataset.setDeckIcon;
        if (!deckStyles[dk]) deckStyles[dk] = {};
        if (val === 'auto') delete deckStyles[dk].icon;
        else deckStyles[dk].icon = val;
        if (!deckStyles[dk].icon && !deckStyles[dk].color) delete deckStyles[dk];
        saveDeckStyles(deckStyles);
        render();
        return;
      }

      const setColorBtn = e.target.closest('[data-set-deck-color]');
      if (setColorBtn) {
        const dk = setColorBtn.dataset.styleDeck;
        const val = setColorBtn.dataset.setDeckColor;
        if (!deckStyles[dk]) deckStyles[dk] = {};
        if (val === 'auto') delete deckStyles[dk].color;
        else deckStyles[dk].color = val;
        if (!deckStyles[dk].icon && !deckStyles[dk].color) delete deckStyles[dk];
        saveDeckStyles(deckStyles);
        render();
        return;
      }

      const resetStyleBtn = e.target.closest('[data-reset-deck-style]');
      if (resetStyleBtn) {
        delete deckStyles[resetStyleBtn.dataset.resetDeckStyle];
        saveDeckStyles(deckStyles);
        render();
        showToast('Estilo restaurado para o modo automático.');
        return;
      }

      const rivalHist = e.target.closest('[data-rival-history]');
      if (rivalHist) {
        const pl = rivalHist.dataset.rivalHistory;
        state.player = pl;
        state.selectedPlayer = pl;
        state.tab = 'history';
        render();
        return;
      }

      const jumpRival = e.target.closest('[data-jump-rival]');
      if (jumpRival) {
        const pl = jumpRival.dataset.jumpRival;
        state.selectedPlayer = pl;
        state.oppSubTab = 'players';
        state.tab = 'opponents';
        render();
        scrollToSection('rival-xray');
        return;
      }

      const selPlayer = e.target.closest('[data-select-player]');
      if (selPlayer) {
        state.selectedPlayer = selPlayer.dataset.selectPlayer;
        render();
        scrollToSection('rival-xray');
        return;
      }

      const jumpPlayer = e.target.closest('[data-jump-player]');
      if (jumpPlayer) {
        const pl = jumpPlayer.dataset.jumpPlayer;
        state.player = state.player === pl ? 'all' : pl;
        render();
        return;
      }

      const selDeck = e.target.closest('[data-select-deck]');
      if (selDeck) {
        state.selectedDeck = selDeck.dataset.selectDeck;
        render();
        scrollToSection('deck-xray');
        return;
      }

      const deckViewBtn = e.target.closest('[data-deck-view]');
      if (deckViewBtn) { state.deckView = deckViewBtn.dataset.deckView; render(); return; }

      const minG = e.target.closest('[data-min-games]');
      if (minG) { state.deckMinGames = Number(minG.dataset.minGames); render(); return; }

      const oppSub = e.target.closest('[data-opp-sub]');
      if (oppSub) { state.oppSubTab = oppSub.dataset.oppSub; state.oppSearch = ''; render(); return; }

      const filterEcmd = e.target.closest('[data-filter-ecmd]');
      if (filterEcmd) { state.enemyCmdFilter = filterEcmd.dataset.filterEcmd; state.tab = 'history'; render(); return; }

      const hmCell = e.target.closest('[data-heatmap-deck]');
      if (hmCell) {
        state.deck = hmCell.dataset.heatmapDeck;
        state.player = hmCell.dataset.heatmapPlayer;
        state.tab = 'history';
        render();
        return;
      }

      const histRes = e.target.closest('[data-hist-res]');
      if (histRes) { state.histRes = histRes.dataset.histRes; render(); return; }

      if (e.target.id === 'btn-hist-order') { state.histOrder = state.histOrder === 'desc' ? 'asc' : 'desc'; render(); return; }
      if (e.target.id === 'btn-export-csv') { exportFilteredCsv(); return; }

      // Report actions
      const repRes = e.target.closest('[data-rep-res]');
      if (repRes) {
        state.report.res = repRes.dataset.repRes;
        if (state.report.res !== 'D') state.report.opponents.forEach(o => { o.winner = false; });
        render();
        return;
      }
      const repOrdem = e.target.closest('[data-rep-ordem]');
      if (repOrdem) { state.report.ordem = repOrdem.dataset.repOrdem; render(); return; }

      const repPreset = e.target.closest('[data-rep-preset]');
      if (repPreset) {
        const len = Number(repPreset.dataset.repPreset);
        while (state.report.opponents.length < len) state.report.opponents.push({ cmd: '', player: '', winner: false });
        if (state.report.opponents.length > len) state.report.opponents = state.report.opponents.slice(0, len);
        render();
        return;
      }
      const oppWin = e.target.closest('[data-opp-winner]');
      if (oppWin && state.report.res === 'D') {
        const idx = Number(oppWin.dataset.oppWinner);
        const already = state.report.opponents[idx].winner;
        state.report.opponents.forEach((o, i) => { o.winner = i === idx ? !already : false; });
        render();
        return;
      }
      const oppRem = e.target.closest('[data-opp-remove]');
      if (oppRem && state.report.opponents.length > 1) {
        state.report.opponents.splice(Number(oppRem.dataset.oppRemove), 1);
        render();
        return;
      }
      if (e.target.id === 'btn-add-opp') { state.report.opponents.push({ cmd: '', player: '', winner: false }); render(); return; }
      if (e.target.id === 'btn-toggle-paste') { state.report.showPasteBox = !state.report.showPasteBox; render(); return; }
      if (e.target.id === 'btn-parse-paste') {
        const parsed = parseTemplateText(state.report.pasteText || '');
        state.report = { ...state.report, ...parsed, showPasteBox: false, pasteText: '' };
        render();
        showToast('Formulário preenchido!');
        return;
      }
      if (e.target.id === 'btn-clear-report') {
        state.report.deck = ''; state.report.borrowed = false; state.report.res = 'V';
        state.report.ordem = ''; state.report.notes = '';
        state.report.opponents = [{ cmd: '', player: '', winner: false }, { cmd: '', player: '', winner: false }, { cmd: '', player: '', winner: false }];
        render();
        return;
      }
      if (e.target.id === 'btn-submit-report') { submitReportToPanel(); return; }
      if (e.target.id === 'btn-copy-current-report' || e.target.id === 'btn-copy-preview') {
        copyTextToClipboard(buildReportText(state.report), 'Report copiado! Cole no chat para gravar na planilha.');
        return;
      }
      if (e.target.id === 'btn-copy-tsv') { copyTextToClipboard(buildSheetsTsv(state.report), 'Linha TSV copiada!'); return; }
      if (e.target.id === 'btn-copy-all-pending') {
        copyTextToClipboard(pendingMatches.map(buildReportTextFromMatch).join('\n\n---\n\n'), `${pendingMatches.length} report(s) copiado(s)!`);
        return;
      }
      const copyPend = e.target.closest('[data-copy-pending]');
      if (copyPend) {
        const m = pendingMatches[Number(copyPend.dataset.copyPending)];
        if (m) copyTextToClipboard(buildReportTextFromMatch(m), `Report da ${m.id} copiado!`);
        return;
      }
      const remPend = e.target.closest('[data-remove-pending]');
      if (remPend) {
        const removed = pendingMatches.splice(Number(remPend.dataset.removePending), 1)[0];
        savePendingMatches(pendingMatches);
        rebuildMatches();
        initFilterSelects();
        render();
        if (removed) showToast(`${removed.id} removida da fila local.`);
        return;
      }
    });

    document.addEventListener('input', e => {
      if (e.target.id === 'quick-search') { state.quickSearch = e.target.value; render('quick-search'); }
      else if (e.target.id === 'deck-search') { state.deckSearch = e.target.value; render('deck-search'); }
      else if (e.target.id === 'opp-search') { state.oppSearch = e.target.value; render('opp-search'); }
      else if (e.target.id === 'hist-search') { state.histSearch = e.target.value; render('hist-search'); }
      else if (e.target.id === 'rep-deck') { state.report.deck = e.target.value; updateReportPreviewLive(); }
      else if (e.target.id === 'rep-notes') { state.report.notes = e.target.value; updateReportPreviewLive(); }
      else if (e.target.id === 'rep-paste-area') { state.report.pasteText = e.target.value; }
      else if (e.target.dataset && e.target.dataset.oppField) {
        const idx = Number(e.target.dataset.oppIdx);
        if (state.report.opponents[idx]) {
          state.report.opponents[idx][e.target.dataset.oppField] = e.target.value;
          updateReportPreviewLive();
        }
      }
    });

    document.addEventListener('change', e => {
      if (e.target.id === 'deck-sort') { state.deckSort = e.target.value; render(); }
      else if (e.target.id === 'rep-month') { state.report.monthIdx = Number(e.target.value); updateReportPreviewLive(); }
      else if (e.target.id === 'rep-borrowed') { state.report.borrowed = e.target.checked; updateReportPreviewLive(); }
    });

    initFilterSelects();
    render();
  </script>
</body>
</html>
