<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commander Match Tracker — Retro Edition 2026</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='11' fill='%23F1D27A' stroke='%234E3626' stroke-width='3'/%3E%3Cg transform='translate(4 4)' stroke='%234E3626' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='11.8' y='9.2' width='15.2' height='21.6' rx='2.8' fill='%23E2A64B' stroke-width='2.2' transform='rotate(-34 19 29.6)'/%3E%3Crect x='14' y='7.6' width='15.6' height='22' rx='2.8' fill='%23F3ECE0' stroke-width='2.2' transform='rotate(-10 20 29.6)'/%3E%3Cg transform='rotate(11 24.5 29)'%3E%3Crect x='17.6' y='7.4' width='16.8' height='23' rx='2.8' fill='%23FCF8F0' stroke-width='2.2'/%3E%3Cpolyline points='20.2,21.8 22.7,15.6 25.1,21.2 27.6,15.6 29.8,21.2 32.2,16.2' fill='none' stroke-width='1.85'/%3E%3Ccircle cx='20.2' cy='21.8' r='1.35' fill='%234E3626' stroke='none'/%3E%3Ccircle cx='25.1' cy='21.2' r='1.35' fill='%234E3626' stroke='none'/%3E%3Ccircle cx='29.8' cy='21.2' r='1.35' fill='%234E3626' stroke='none'/%3E%3Ccircle cx='32.2' cy='16.2' r='1.35' fill='%234E3626' stroke='none'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style id="cmt-base-style">
    * { box-sizing: border-box; }
    body {
      background-color: #F3ECE0;
      color: #4E3626;
      margin: 0;
      padding: 0;
      background-image: radial-gradient(rgba(78, 54, 38, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Neo-Brutalist Core Primitives (Retro @BackToColor Palette) */
    .nb-card {
      background-color: #FCF8F0;
      border: 2px solid #4E3626;
      border-radius: 16px;
      box-shadow: 4px 4px 0 #4E3626;
    }
    .nb-card-sm {
      background-color: #FCF8F0;
      border: 2px solid #4E3626;
      border-radius: 12px;
      box-shadow: 3px 3px 0 #4E3626;
    }
    .nb-subtle {
      background-color: #F3ECE0;
      border: 2px solid #4E3626;
      border-radius: 12px;
    }

    /* Iconic Folder Card */
    .nb-folder {
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.12s ease;
    }
    .nb-folder-clickable {
      cursor: pointer;
    }
    .nb-folder-clickable:hover {
      transform: translate(-2px, -2px);
    }
    .nb-folder-clickable:hover .nb-folder-body {
      box-shadow: 6px 6px 0 #4E3626;
    }
    .nb-folder-clickable:active {
      transform: translate(2px, 2px);
    }
    .nb-folder-clickable:active .nb-folder-body {
      box-shadow: 2px 2px 0 #4E3626;
    }
    .nb-folder-tab {
      width: 46%;
      max-width: 108px;
      min-width: 56px;
      height: 11px;
      border: 2px solid #4E3626;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      margin-left: 8px;
      position: relative;
      z-index: 2;
    }
    .nb-folder-body {
      background-color: #FCF8F0;
      border: 2px solid #4E3626;
      border-radius: 14px;
      box-shadow: 4px 4px 0 #4E3626;
      margin-top: -2px;
      position: relative;
      z-index: 1;
      transition: box-shadow 0.12s ease;
      flex: 1;
    }
    .nb-icon-box {
      width: 40px;
      height: 40px;
      border: 2px solid #4E3626;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #4E3626;
    }

    /* Tactile Buttons & Pills */
    .nb-btn {
      border: 2px solid #4E3626;
      border-radius: 12px;
      box-shadow: 3px 3px 0 #4E3626;
      background-color: #FCF8F0;
      color: #4E3626;
      font-weight: 700;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
      cursor: pointer;
    }
    .nb-btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #4E3626;
    }
    .nb-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #4E3626;
    }
    .nb-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: 1px 1px 0 #4E3626;
    }
    .nb-btn-yellow {
      background-color: #F1D27A !important;
      color: #4E3626 !important;
    }
    .nb-btn-green {
      background-color: #C8CF7A !important;
      color: #4E3626 !important;
    }
    .nb-btn-pink {
      background-color: #D7653A !important;
      color: #F3ECE0 !important;
    }
    .nb-btn-purple {
      background-color: #E2A64B !important;
      color: #4E3626 !important;
    }
    .nb-btn-black {
      background-color: #4E3626 !important;
      color: #F3ECE0 !important;
    }

    .nb-pill {
      border: 2px solid #4E3626;
      border-radius: 10px;
      background-color: #FCF8F0;
      color: #4E3626;
      font-weight: 700;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.1s ease;
      cursor: pointer;
    }
    .nb-pill:hover {
      background-color: #F3ECE0;
    }
    .nb-pill-active {
      background-color: #F1D27A !important;
      color: #4E3626 !important;
      box-shadow: 2px 2px 0 #4E3626;
    }

    /* Retro Badges */
    .badge-win {
      background-color: #C8CF7A;
      color: #4E3626;
      border: 1.5px solid #4E3626;
      font-weight: 800;
    }
    .badge-loss {
      background-color: #D7653A;
      color: #F3ECE0;
      border: 1.5px solid #4E3626;
      font-weight: 800;
    }
    .badge-draw {
      background-color: #F1D27A;
      color: #4E3626;
      border: 1.5px solid #4E3626;
      font-weight: 800;
    }
    .badge-neutral {
      background-color: #F3ECE0;
      color: #4E3626;
      border: 1.5px solid #4E3626;
      font-weight: 700;
    }
    .badge-pop-pink {
      background-color: #D7653A;
      color: #F3ECE0;
      border: 1.5px solid #4E3626;
      font-weight: 800;
    }
    .badge-pop-purple {
      background-color: #E2A64B;
      color: #4E3626;
      border: 1.5px solid #4E3626;
      font-weight: 800;
    }
    .badge-pop-yellow {
      background-color: #F1D27A;
      color: #4E3626;
      border: 1.5px solid #4E3626;
      font-weight: 800;
    }

    /* Form Controls */
    select, input[type="text"], input[type="search"], input[type="number"], input[type="date"], input[type="url"], textarea {
      background-color: #FCF8F0;
      color: #4E3626;
      border: 2px solid #4E3626;
      border-radius: 10px;
      font-weight: 500;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      box-shadow: 3px 3px 0 #F1D27A;
    }

    .text-muted { color: #745A46; }
    .wr-high { color: #4A5530; }
    .wr-mid { color: #B06A1E; }
    .wr-low { color: #B94B24; }

    #tooltip {
      pointer-events: none;
      position: fixed;
      z-index: 70;
      background-color: #FCF8F0;
      color: #4E3626;
      border: 2px solid #4E3626;
      border-radius: 12px;
      box-shadow: 4px 4px 0 #4E3626;
    }

    .interactive-row { transition: background-color 0.1s ease; }
    .interactive-row:hover { background-color: #F3ECE0; }

    .scroll-thin::-webkit-scrollbar { height: 7px; width: 7px; }
    .scroll-thin::-webkit-scrollbar-thumb {
      background-color: #4E3626;
      border-radius: 9999px;
    }
    .scroll-thin::-webkit-scrollbar-track {
      background-color: #F3ECE0;
      border-radius: 9999px;
    }
    .hscroll-viewport {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #4E3626 #F3ECE0;
    }
    .hscroll-fade-right {
      background: linear-gradient(to right, rgba(255, 253, 247, 0), rgba(78, 54, 38, 0.16));
    }

    @keyframes xrayPop {
      0% { box-shadow: 0 0 0 4px #F1D27A, 4px 4px 0 #4E3626; }
      100% { box-shadow: 4px 4px 0 #4E3626; }
    }
    .xray-flash {
      animation: xrayPop 0.65s ease-out;
    }
    #deck-xray, #rival-xray {
      scroll-margin-top: 16px;
    }
  </style>
</head>
<body class="antialiased min-h-screen overflow-x-hidden">
  <!-- Floating Neo-Brutalist Tooltip -->
  <div id="tooltip" class="hidden px-3 py-2 text-xs max-w-xs leading-relaxed"></div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed bottom-5 right-5 z-50 nb-card-sm px-4 py-2.5 text-xs font-extrabold flex items-center gap-2"></div>

  <!-- Decorative Sun-Washed Laguna Accent Bar -->
  <div class="w-full h-2.5 flex border-b-2 border-[#4E3626]">
    <div class="flex-1 bg-[#4A5530]"></div>
    <div class="flex-1 bg-[#C8CF7A]"></div>
    <div class="flex-1 bg-[#F1D27A]"></div>
    <div class="flex-1 bg-[#E2A64B]"></div>
    <div class="flex-1 bg-[#EC8B33]"></div>
    <div class="flex-1 bg-[#D7653A]"></div>
    <div class="flex-1 bg-[#4E3626]"></div>
  </div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 space-y-5">
    <!-- Top Header + Navigation (Reference-inspired) -->
    <header class="space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        <!-- Brand & Punchy Title -->
        <div class="flex items-start gap-3">
          <div class="nb-icon-box !w-12 !h-12 !rounded-xl bg-[#F1D27A] shadow-[3px_3px_0_#4E3626] mt-0.5" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 40 40" fill="none" stroke="#4E3626" stroke-linecap="round" stroke-linejoin="round">
              <!-- Back-left fanned card -->
              <rect x="11.8" y="9.2" width="15.2" height="21.6" rx="2.8" fill="#E2A64B" stroke-width="2.1" transform="rotate(-34 19 29.6)"/>
              <!-- Middle fanned card -->
              <rect x="14" y="7.6" width="15.6" height="22" rx="2.8" fill="#F3ECE0" stroke-width="2.1" transform="rotate(-10 20 29.6)"/>
              <!-- Front fully visible card with inner chart -->
              <g transform="rotate(11 24.5 29)">
                <rect x="17.6" y="7.4" width="16.8" height="23" rx="2.8" fill="#FCF8F0" stroke-width="2.1"/>
                <polyline points="20.2,21.8 22.7,15.6 25.1,21.2 27.6,15.6 29.8,21.2 32.2,16.2" fill="none" stroke-width="1.75"/>
                <circle cx="20.2" cy="21.8" r="1.25" fill="#4E3626" stroke="none"/>
                <circle cx="25.1" cy="21.2" r="1.25" fill="#4E3626" stroke="none"/>
                <circle cx="29.8" cy="21.2" r="1.25" fill="#4E3626" stroke="none"/>
                <circle cx="32.2" cy="16.2" r="1.25" fill="#4E3626" stroke="none"/>
              </g>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <div id="format-menu-wrap" class="relative">
                <button id="btn-format-menu" type="button" aria-haspopup="menu" aria-expanded="false"
                  data-tip="Selecionar formato de Magic: The Gathering"
                  class="px-2.5 py-0.5 rounded-md text-xs badge-pop-purple inline-flex items-center gap-1.5 cursor-pointer hover:brightness-95 active:translate-y-px transition">
                  <span id="format-label">MTG COMMANDER</span>
                  <svg id="format-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" class="transition-transform" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div id="format-dropdown" role="menu" class="hidden absolute left-0 mt-2 w-72 max-h-80 overflow-y-auto nb-card-sm p-2 z-50 space-y-2"></div>
              </div>
              <span id="header-scope" class="text-xs font-semibold text-muted">
                Janeiro – Novembro 2026 · 212 partidas registradas
              </span>
            </div>
            <h1 id="hero-tagline" class="text-2xl sm:text-3xl font-black tracking-tight leading-none mt-1.5 text-[#4E3626]">
              Seu legado em números.
            </h1>
          </div>
        </div>

        <!-- Tactile Navigation Buttons -->
        <nav class="flex items-center gap-2 flex-wrap" role="tablist" aria-label="Seções do painel">
          <button class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tab="overview" role="tab" aria-selected="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span id="nav-lbl-overview">Visão Geral</span>
          </button>
          <button class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tab="decks" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span id="nav-lbl-decks">Decks</span>
          </button>
          <button class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tab="opponents" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span id="nav-lbl-opponents">Oponentes</span>
          </button>
          <button class="nb-btn px-3 py-2 text-xs inline-flex items-center gap-1.5" data-tab="history" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="nav-lbl-history">Histórico</span>
          </button>
          <button class="nb-btn nb-btn-yellow px-3.5 py-2 text-xs inline-flex items-center gap-1.5" data-tab="report" role="tab" aria-selected="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="nav-lbl-report">Reportar</span>
            <span id="pending-tab-badge" class="hidden px-1.5 py-0.2 rounded-md text-xs badge-pop-pink">0</span>
          </button>
          <div id="lang-menu-wrap" class="relative">
            <button id="btn-lang-menu" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Idioma / Language"
              data-tip="Alterar idioma (Português BR / English)"
              class="nb-btn px-2.5 py-2 text-xs inline-flex items-center gap-1">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div id="lang-dropdown" role="menu" class="hidden absolute right-0 mt-2 w-44 nb-card-sm p-1.5 z-50 space-y-1">
              <button type="button" role="menuitem" data-set-lang="pt" class="w-full px-2.5 py-1.5 rounded-lg text-xs font-extrabold flex items-center justify-between hover:bg-[#F3ECE0] cursor-pointer">
                <span class="inline-flex items-center gap-2"><span class="px-1.5 py-0.2 rounded badge-neutral font-mono">PT</span><span>Português (BR)</span></span>
                <span data-lang-check="pt" class="font-black">✓</span>
              </button>
              <button type="button" role="menuitem" data-set-lang="en" class="w-full px-2.5 py-1.5 rounded-lg text-xs font-extrabold flex items-center justify-between hover:bg-[#F3ECE0] cursor-pointer">
                <span class="inline-flex items-center gap-2"><span class="px-1.5 py-0.2 rounded badge-neutral font-mono">EN</span><span>English</span></span>
                <span data-lang-check="en" class="font-black hidden">✓</span>
              </button>
            </div>
          </div>
        </nav>
      </div>

      <!-- Signature Quick-Action Bar (inspired by "# Paste link to save" + Yellow "+" button) -->
      <div id="global-filter-bar" class="space-y-2.5">
        <div class="flex items-stretch gap-2.5">
          <div class="flex-1 nb-card-sm flex items-center px-3 gap-2">
            <span class="font-black text-base text-[#4E3626] select-none">#</span>
            <input id="quick-search" type="search" placeholder="Busca rápida: digite um deck, jogador, comandante ou CMD-212..." class="w-full py-2.5 text-xs bg-transparent !border-0 !shadow-none focus:!shadow-none" />
            <button id="btn-toggle-fav-filter" class="px-2.5 py-1 rounded-lg text-xs font-bold border-2 border-[#4E3626] bg-[#F3ECE0] hover:bg-[#F1D27A] cursor-pointer shrink-0 inline-flex items-center gap-1" data-tip="Filtrar apenas decks favoritados">
              <span id="fav-filter-star">★</span>
              <span id="lbl-fav-quick" class="hidden sm:inline">Favoritos</span>
              <span id="fav-count-badge" class="tabular-nums">(0)</span>
            </button>
            <button id="btn-toggle-filters" class="px-2.5 py-1 rounded-lg text-xs font-bold border-2 border-[#4E3626] bg-[#F3ECE0] hover:bg-[#F1D27A] cursor-pointer shrink-0 inline-flex items-center gap-1">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4E3626" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <span id="lbl-filters-quick">Filtros</span>
            </button>
          </div>
          <button id="btn-add-quick" data-tab="report" data-tip="Reportar nova partida" class="nb-btn nb-btn-yellow w-12 shrink-0 flex items-center justify-center text-xl font-black" aria-label="Reportar nova partida">
            +
          </button>
        </div>

        <!-- Collapsible Structured Filters Strip -->
        <section id="filters-drawer" class="nb-card-sm p-3.5 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5 items-end">
            <div>
              <label id="lbl-f-month" for="f-month" class="block text-xs font-extrabold mb-1">Mês</label>
              <select id="f-month" class="w-full px-2.5 py-1.5 text-xs"></select>
            </div>
            <div>
              <label id="lbl-f-deck" for="f-deck" class="block text-xs font-extrabold mb-1">Meu Deck</label>
              <select id="f-deck" class="w-full px-2.5 py-1.5 text-xs"></select>
            </div>
            <div>
              <label id="lbl-f-player" for="f-player" class="block text-xs font-extrabold mb-1">Oponente (Jogador)</label>
              <select id="f-player" class="w-full px-2.5 py-1.5 text-xs"></select>
            </div>
            <div>
              <span id="lbl-f-pod" class="block text-xs font-extrabold mb-1">Tamanho da Mesa</span>
              <div id="f-pod-group" class="grid grid-cols-4 gap-1">
                <button id="pod-pill-all" data-pod="all" class="pod-pill nb-pill px-2 py-1.5 text-xs nb-pill-active">Todas</button>
                <button data-pod="2" class="pod-pill nb-pill px-2 py-1.5 text-xs">1v1</button>
                <button data-pod="3" class="pod-pill nb-pill px-2 py-1.5 text-xs">3P</button>
                <button data-pod="4+" class="pod-pill nb-pill px-2 py-1.5 text-xs">4+P</button>
              </div>
            </div>
            <div>
              <span id="lbl-f-origin" class="block text-xs font-extrabold mb-1">Origem do Deck</span>
              <div id="f-origin-group" class="grid grid-cols-3 gap-1">
                <button id="origin-pill-all" data-origin="all" class="origin-pill nb-pill px-2 py-1.5 text-xs nb-pill-active">Todos</button>
                <button id="origin-pill-own" data-origin="own" class="origin-pill nb-pill px-2 py-1.5 text-xs">Próprios</button>
                <button id="origin-pill-borrowed" data-origin="borrowed" class="origin-pill nb-pill px-2 py-1.5 text-xs">Emprest.</button>
              </div>

    function getDeckColorIdentity(deckName) {
      const m = (typeof deckMeta !== 'undefined' && deckMeta) ? deckMeta[deckName] : null;
      if (m && m.colorsCustom && Array.isArray(m.colors)) {
        return MANA_ORDER.filter(c => m.colors.includes(c));
      }
      const clean = String(deckName || '').replace(/\s*\((?:emprestado|borrowed)\)/gi, '').trim();
      const base = DECK_COLOR_IDENTITY[clean] || [];
      return MANA_ORDER.filter(c => base.includes(c));
    }

    function getEnemyCmdColorIdentity(cmdName) {
      const clean = String(cmdName || '').trim();
      if (!clean) return null;
      if (Object.prototype.hasOwnProperty.call(ENEMY_CMD_COLOR_IDENTITY, clean)) {
        return MANA_ORDER.filter(c => ENEMY_CMD_COLOR_IDENTITY[clean].includes(c));
      }
      if (Object.prototype.hasOwnProperty.call(DECK_COLOR_IDENTITY, clean)) {
        return MANA_ORDER.filter(c => DECK_COLOR_IDENTITY[clean].includes(c));
      }
      const low = clean.toLowerCase();
      if (_CMD_COLOR_LOWER_LOOKUP.has(low)) {
        const arr = _CMD_COLOR_LOWER_LOOKUP.get(low);
        return MANA_ORDER.filter(c => arr.includes(c));
      }
      return null;
    }

      return entry ? (isEn() ? entry[1] : entry[0]) : key;

    function autoDeckAccent(d) {
      if (d.borrowed) return { color: '#DCCBAE', ink: '#4E3626', iconKey: 'folder', icon: ICONS.folder };
      if (d.wr === 1 && d.games >= 3) return { color: '#4A5530', ink: '#F3ECE0', iconKey: 'crown', icon: ICONS.crown };
      if (d.wr >= 0.7) return { color: '#C8CF7A', ink: '#4E3626', iconKey: 'bolt', icon: ICONS.bolt };
      if (d.wr >= 0.55) return { color: '#F1D27A', ink: '#4E3626', iconKey: 'star', icon: ICONS.star };
      if (d.wr >= 0.45) return { color: '#E2A64B', ink: '#4E3626', iconKey: 'book', icon: ICONS.book };
      return { color: '#D7653A', ink: '#FCF8F0', iconKey: 'heart', icon: ICONS.heart };
    }

    function deckAccent(d) {
      const base = autoDeckAccent(d);
      const custom = deckStyles[d.deck];
      if (!custom) return { ...base, customIcon: false, customColor: false };
      let color = base.color, ink = base.ink, customColor = false;
      if (custom.color) {
        const mappedKey = LEGACY_PALETTE_MAP[custom.color] || custom.color;
        const pal = PALETTE_OPTIONS.find(p => p.key === mappedKey);
        if (pal) { color = pal.color; ink = pal.ink; customColor = true; }
      }
      let icon = base.icon, iconKey = base.iconKey, customIcon = false;
      if (custom.icon && ICONS[custom.icon]) {
        icon = ICONS[custom.icon];
        iconKey = custom.icon;
        customIcon = true;
      }
      return { color, ink, icon, iconKey, customIcon, customColor };
    }

    function getClassicDeckMap() {
      const counts = new Map();
      const firstSeen = new Map();
      for (const m of MATCHES) {
        if (m.borrowed) continue;
        counts.set(m.deck, (counts.get(m.deck) || 0) + 1);
        if (!firstSeen.has(m.deck)) firstSeen.set(m.deck, { n: m.n, id: m.id, month: m.month });
      }
      const qualified = Array.from(firstSeen.entries())
        .filter(([deck]) => (counts.get(deck) || 0) > 5)
        .sort((a, b) => a[1].n - b[1].n)
        .slice(0, 5);
      const result = new Map();
      qualified.forEach(([deck, info], idx) => {
        result.set(deck, { rank: idx + 1, id: info.id, month: info.month, totalGames: counts.get(deck) });
      });
      return result;
    }

    function getDeckCurrentWinStreak(deckName, matchesList) {
      let streak = 0;
      for (let i = matchesList.length - 1; i >= 0; i--) {
        if (matchesList[i].deck !== deckName) continue;
        if (matchesList[i].res === 'V') streak++;
        else break;
      }
      return streak;
    }

    function getDeckBadges(d, opts = {}) {
      const badges = [];
      const classicInfo = getClassicDeckMap().get(d.deck);
      const streak = getDeckCurrentWinStreak(d.deck, d.matches || MATCHES);

      if (d.borrowed) {
        badges.push({
          label: tr('EMPREST.', 'BORROWED'),
          cls: 'badge-neutral',
          tip: tr('Deck emprestado utilizado em partidas registradas.', 'Borrowed deck played in recorded matches.')
        });
      }
      if (!d.borrowed && d.wr === 1 && d.games >= 3) {
        badges.push({
          label: tr('INVICTO', 'UNDEFEATED'),
          cls: 'badge-win',
          tip: tr(`100% de aproveitamento com 3 ou mais jogos (${fmtRecord(d.w, 0, 0)}).`, `100% win rate across 3 or more games (${fmtRecord(d.w, 0, 0)}).`)
        });
      }
      if (!d.borrowed && d.wr >= 0.7 && d.games >= 10) {
        badges.push({
          label: 'TOP',
          cls: 'badge-pop-pink',
          tip: tr(`Desempenho de elite: 70%+ de Win Rate com pelo menos 10 partidas (${fmtPct(d.wr)} em ${d.games} jogos).`, `Elite performance: 70%+ Win Rate with at least 10 games (${fmtPct(d.wr)} in ${d.games} games).`)
        });
      }
      if (streak >= 3) {
        badges.push({
          label: tr('EM ALTA', 'ON FIRE'),
          cls: 'badge-pop-yellow',
          tip: tr(`Em grande fase: ${streak} vitórias seguidas nas partidas mais recentes deste deck!`, `Hot streak: ${streak} consecutive wins in this deck's most recent games!`)
        });
      }
      if (classicInfo) {
        const cMonth = monthName(MATCHES.find(m => m.id === classicInfo.id)?.monthIdx ?? 0) || classicInfo.month;
        badges.push({
          label: tr('CLÁSSICO', 'CLASSIC'),
          cls: 'badge-pop-purple',
          tip: tr(`Deck de assinatura (#${classicInfo.rank} entre os 5 mais antigos com mais de 5 jogos) — estreou na ${classicInfo.id} (${cMonth}/2026).`, `Signature deck (#${classicInfo.rank} of the 5 oldest decks with 5+ games) — debuted in ${classicInfo.id} (${cMonth} 2026).`)
        });
      }
      if (opts.honorable && !d.borrowed) {
        badges.push({
          label: tr('MENÇÃO', 'HONORABLE'),
          cls: 'badge-neutral',
          tip: tr('Menos de 5 partidas registradas — amostra pequena (Menção Honrosa).', 'Under 5 recorded matches — small sample (Honorable Mention).')
        });
      }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    function fmtPct(v, decimals = 1) {

    function wrapHScroll(innerHtml) {

          </div>
        </div>

    function updateSingleHScroll(shell) {
      const vp = shell.querySelector('[data-hscroll]');
      const bar = shell.querySelector('.hscroll-bar');
      const thumb = shell.querySelector('.hscroll-thumb');
      const hint = shell.querySelector('.hscroll-hint');
      const fade = shell.querySelector('.hscroll-fade-right');
      if (!vp || !bar || !thumb) return;

      const maxScroll = vp.scrollWidth - vp.clientWidth;
      if (maxScroll <= 3) {
        bar.classList.add('hidden');
        if (fade) fade.classList.add('hidden');
        return;
      }

      bar.classList.remove('hidden');
      const ratio = vp.clientWidth / vp.scrollWidth;
      const thumbW = Math.max(22, Math.min(85, ratio * 100));
      const progress = Math.max(0, Math.min(1, vp.scrollLeft / maxScroll));
      const leftPct = progress * (100 - thumbW);
      thumb.style.width = thumbW.toFixed(1) + '%';
      thumb.style.left = leftPct.toFixed(1) + '%';

      if (hint) {
        if (progress <= 0.04) hint.textContent = tr('Deslize p/ direita →', 'Swipe right →');
        else if (progress >= 0.96) hint.textContent = tr('← Deslize p/ esquerda', '← Swipe left');
        else hint.textContent = tr('← Deslize p/ ver mais →', '← Swipe to see more →');
      }
      if (fade) {
        fade.classList.toggle('hidden', progress >= 0.96);
      }
    }

    function initTableScrollbars() {
      document.querySelectorAll('.hscroll-shell').forEach(shell => {
        const vp = shell.querySelector('[data-hscroll]');
        const track = shell.querySelector('.hscroll-track');
        if (!vp) return;
        if (!vp.dataset.hscrollBound) {
          vp.dataset.hscrollBound = '1';
          vp.addEventListener('scroll', () => updateSingleHScroll(shell), { passive: true });
          if (track) {
            const scrollToClientX = clientX => {
              const rect = track.getBoundingClientRect();
              const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
              vp.scrollLeft = pct * (vp.scrollWidth - vp.clientWidth);
            };
            track.addEventListener('click', e => scrollToClientX(e.clientX));
            let dragging = false;
            track.addEventListener('pointerdown', e => {
              dragging = true;
              if (track.setPointerCapture) track.setPointerCapture(e.pointerId);
              scrollToClientX(e.clientX);
            });
            track.addEventListener('pointermove', e => { if (dragging) scrollToClientX(e.clientX); });
            track.addEventListener('pointerup', () => { dragging = false; });
            track.addEventListener('pointercancel', () => { dragging = false; });
          }
        }
        updateSingleHScroll(shell);
      });
    }

    function getFilteredMatches() {
      const q = state.quickSearch.trim().toLowerCase();
      return MATCHES.filter(m => {
        if (state.month !== 'all' && m.monthIdx !== Number(state.month)) return false;
        if (state.deck !== 'all' && m.deck !== state.deck) return false;
        if (state.player !== 'all' && !m.players.includes(state.player)) return false;
        if (state.pod === '2' && m.pod !== 2) return false;
        if (state.pod === '3' && m.pod !== 3) return false;
        if (state.pod === '4+' && m.pod < 4) return false;
        if (state.origin === 'own' && m.borrowed) return false;
        if (state.origin === 'borrowed' && !m.borrowed) return false;
        if (state.onlyFavorites && !favoriteDecks.has(m.deck)) return false;
        if (state.enemyCmdFilter && !m.enemyCmds.includes(state.enemyCmdFilter)) return false;
        if (q) {
          const hay = `${m.id} ${m.month} ${m.deck} ${m.oppStr} ${m.note}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

    function calcStats(list) {
      let w = 0, l = 0, d = 0, expSum = 0;
      let curWin = 0, bestWin = 0, curLoss = 0, worstLoss = 0;
      for (const m of list) {
        expSum += 1 / m.pod;
        if (m.res === 'V') {
          w++; curWin++; curLoss = 0;
          if (curWin > bestWin) bestWin = curWin;
        } else if (m.res === 'D') {
          l++; curLoss++; curWin = 0;
          if (curLoss > worstLoss) worstLoss = curLoss;
        } else {
          d++; curWin = 0; curLoss = 0;
        }
      }
      const total = list.length;
      const wr = total ? w / total : 0;
      const expWr = total ? expSum / total : 0;
      let currentStreakLabel = '—';
      let currentStreakType = 'neutral';
      if (total) {
        const last = list[list.length - 1];
        let cnt = 0;
        for (let i = list.length - 1; i >= 0 && list[i].res === last.res; i--) cnt++;
        if (last.res === 'V') { currentStreakLabel = tr(`+${cnt}V seguidas`, `+${cnt}W streak`); currentStreakType = 'win'; }
        else if (last.res === 'D') { currentStreakLabel = tr(`${cnt}D seguidas`, `${cnt}L streak`); currentStreakType = 'loss'; }
        else { currentStreakLabel = tr('Empate recente', 'Recent draw'); currentStreakType = 'draw'; }
      }
      return { total, w, l, d, wr, expWr, delta: wr - expWr, bestWin, worstLoss, currentStreakLabel, currentStreakType };
    }

    function fmtTurns(v, decimals = 1) {
      if (v === null || v === undefined || !isFinite(v)) return '—';
      const raw = Number.isInteger(v) ? String(v) : v.toFixed(decimals);
      return (isEn() ? raw : raw.replace('.', ',')) + 't';
    }

    function calcTurnStats(list) {
      const valid = list.filter(m => Number(m.turns) > 0);
      if (!valid.length) {
        return { count: 0, avg: null, avgWin: null, avgLoss: null, winCount: 0, lossCount: 0, min: null, max: null };
      }
      const nums = valid.map(m => Number(m.turns));
      const wins = valid.filter(m => m.res === 'V').map(m => Number(m.turns));
      const losses = valid.filter(m => m.res === 'D').map(m => Number(m.turns));
      const avgOf = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
      return {
        count: valid.length,
        avg: avgOf(nums),
        avgWin: avgOf(wins),
        avgLoss: avgOf(losses),
        winCount: wins.length,
        lossCount: losses.length,
        min: Math.min(...nums),
        max: Math.max(...nums)
      };
    }

    function wilsonScore(w, n, z = 1.645) {
      if (!n) return 0;
      const p = w / n;
      const denom = 1 + (z * z) / n;
      const center = p + (z * z) / (2 * n);
      const margin = z * Math.sqrt((p * (1 - p) + (z * z) / (4 * n)) / n);
      return Math.max(0, (center - margin) / denom);
    }

    function groupDecks(list) {
      const map = new Map();
      for (const m of list) {
        if (!map.has(m.deck)) {
          map.set(m.deck, { deck: m.deck, borrowed: m.borrowed, games: 0, w: 0, l: 0, d: 0, expSum: 0, matches: [] });
        }
        const g = map.get(m.deck);
        g.games++;
        g.expSum += 1 / m.pod;
        if (m.res === 'V') g.w++;
        else if (m.res === 'D') g.l++;
        else g.d++;
        g.matches.push(m);
      }
      return Array.from(map.values()).map(g => ({
        ...g,
        wr: g.games ? g.w / g.games : 0,
        expWr: g.games ? g.expSum / g.games : 0,
        wilson: wilsonScore(g.w, g.games),
        recent: g.matches.slice(-5).map(x => x.res)
      }));
    }

    function groupPlayers(list) {
      const map = new Map();
      for (const m of list) {
        for (const p of m.players) {
          if (!map.has(p)) {
            map.set(p, { player: p, games: 0, w: 0, l: 0, d: 0, oppWins: 0, expSum: 0 });
          }
          const g = map.get(p);
          g.games++;
          g.expSum += 1 / m.pod;
          if (m.res === 'V') g.w++;
          else if (m.res === 'D') g.l++;
          else g.d++;
          if (m.winnerPlayer === p) g.oppWins++;
        }
      }
      return Array.from(map.values()).map(g => ({
        ...g,
        wr: g.games ? g.w / g.games : 0,
        expWr: g.games ? g.expSum / g.games : 0
      }));
    }

    function groupEnemyCmds(list) {
      const map = new Map();
      for (const m of list) {
        const seen = new Set();
        for (const c of m.enemyCmds) {
          if (seen.has(c)) continue;
          seen.add(c);
          if (!map.has(c)) map.set(c, { cmd: c, games: 0, w: 0, l: 0, d: 0, players: new Set() });
          const g = map.get(c);
          g.games++;
          if (m.res === 'V') g.w++;
          else if (m.res === 'D') g.l++;
          else g.d++;
          m.players.forEach(p => g.players.add(p));
        }
      }
      return Array.from(map.values()).map(g => ({
        ...g,
        wr: g.games ? g.w / g.games : 0,
        playersList: Array.from(g.players)
      }));
    }

    // =========================================================================
    // TOOLTIP SYSTEM (1.5s hover delay on Desktop · Tap / 500ms Long-Press on Mobile)
    // =========================================================================
    const tooltipEl = document.getElementById('tooltip');
    const TIP_HOVER_DELAY_MS = 1500;
    const TIP_LONG_PRESS_MS = 500;
    const TIP_INTERACTIVE_SEL = 'button, a, input, select, [data-jump-deck], [data-jump-rival], [data-click-month], [data-click-pod], [data-filter-ecmd], [data-heatmap-deck], [data-select-deck], [data-select-player]';

    let tipTarget = null;
    let tipTimer = null;
    let tipVisible = false;
    let tipLastPos = { x: 0, y: 0 };
    let touchTimer = null;
    let touchStartPos = null;
    let lastTouchTime = 0;
    let suppressNextClick = false;

    function positionTooltipAt(x, y) {
      const pad = 12;
      const rect = tooltipEl.getBoundingClientRect();
      let left = x + pad;
      let top = y + pad;
      if (left + rect.width > window.innerWidth - 8) left = x - rect.width - pad;
      if (top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
      tooltipEl.style.left = Math.max(8, left) + 'px';
      tooltipEl.style.top = Math.max(8, top) + 'px';
    }

    function showTooltipAt(x, y, html) {
      tooltipEl.innerHTML = html;
      tooltipEl.classList.remove('hidden');
      tipVisible = true;
      positionTooltipAt(x, y);
    }

    function hideTooltip() {
      clearTimeout(tipTimer);
      clearTimeout(touchTimer);
      tipTimer = null;
      touchTimer = null;
      tipTarget = null;
      tipVisible = false;
      tooltipEl.classList.add('hidden');
    }

    // Universal normalizer: converts any native HTML title="..." into data-tip so
    // EVERY tooltip (existing or future) obeys the single 1.5s desktop / touch rule.
    function normalizeNativeTitles(rootEl = document) {
      rootEl.querySelectorAll('[title]').forEach(el => {
        const t = el.getAttribute('title');
        el.removeAttribute('title');
        if (t && !el.hasAttribute('data-tip')) {
          el.setAttribute('data-tip', esc(t));
        }
      });
    }

    function resolveTipTarget(node) {
      if (!node || !node.closest) return null;
      const el = node.closest('[data-tip], [title]');
      if (!el) return null;
      if (el.hasAttribute('title')) {
        const t = el.getAttribute('title');
        el.removeAttribute('title');
        if (t && !el.hasAttribute('data-tip')) el.setAttribute('data-tip', esc(t));
      }
      return el.hasAttribute('data-tip') ? el : null;
    }

    // Desktop hover with universal 1.5s delay
    document.addEventListener('mousemove', e => {
      if (Date.now() - lastTouchTime < 800) return;
      const target = resolveTipTarget(e.target);
      if (!target) {
        if (tipTarget || tipVisible) hideTooltip();
        return;
      }
      tipLastPos = { x: e.clientX, y: e.clientY };
      if (target !== tipTarget) {
        clearTimeout(tipTimer);
        tooltipEl.classList.add('hidden');
        tipVisible = false;
        tipTarget = target;
        tipTimer = setTimeout(() => {
          if (tipTarget === target && document.contains(target)) {
            showTooltipAt(tipLastPos.x, tipLastPos.y, target.getAttribute('data-tip'));
          }
        }, TIP_HOVER_DELAY_MS);
      } else if (tipVisible) {
        positionTooltipAt(e.clientX, e.clientY);
      }
    });

    document.addEventListener('mouseleave', hideTooltip);
    document.addEventListener('mousedown', hideTooltip);
    window.addEventListener('scroll', hideTooltip, true);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        hideTooltip();
        if (state.langMenuOpen || state.formatMenuOpen) {
          state.langMenuOpen = false;
          state.formatMenuOpen = false;
          syncStaticI18n();
        }
      }
    });

    // Mobile touch: tap on info-only cards, 500ms long-press on clickable controls
    document.addEventListener('touchstart', e => {
      lastTouchTime = Date.now();
      clearTimeout(touchTimer);
      const t = e.touches[0];
      touchStartPos = { x: t.clientX, y: t.clientY };
      const target = resolveTipTarget(e.target);
      if (!target) {
        if (tipVisible) hideTooltip();
        return;
      }
      const isInteractive = Boolean(target.closest(TIP_INTERACTIVE_SEL));
      if (!isInteractive) {
        if (tipVisible && tipTarget === target) {
          hideTooltip();
        } else {
          hideTooltip();
          tipTarget = target;
          showTooltipAt(t.clientX, t.clientY, target.getAttribute('data-tip'));
        }
      } else {
        touchTimer = setTimeout(() => {
          tipTarget = target;
          suppressNextClick = true;
          showTooltipAt(touchStartPos.x, touchStartPos.y, target.getAttribute('data-tip'));
        }, TIP_LONG_PRESS_MS);
      }
    }, { passive: true });

    document.addEventListener('touchmove', e => {
      if (!touchStartPos) return;
      const t = e.touches[0];
      if (Math.hypot(t.clientX - touchStartPos.x, t.clientY - touchStartPos.y) > 10) {
        clearTimeout(touchTimer);
        touchTimer = null;
      }
    }, { passive: true });

    document.addEventListener('touchend', () => {
      lastTouchTime = Date.now();
      clearTimeout(touchTimer);
      touchTimer = null;
    }, { passive: true });

    document.addEventListener('click', e => {
      if (suppressNextClick) {
        suppressNextClick = false;
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    // =========================================================================
    // TAB 1: OVERVIEW
    // =========================================================================
    function renderOverview(filtered) {
      if (!filtered.length) return renderEmptyState();

      const hasDec = MATCHES.some(x => x.monthIdx === 11);
      const activeCount = hasDec ? 12 : 11;
      const monthly = Array.from({ length: activeCount }, (_, i) => {
        const list = filtered.filter(m => m.monthIdx === i);
        const w = list.filter(x => x.res === 'V').length;
        const l = list.filter(x => x.res === 'D').length;
        const d = list.filter(x => x.res === 'E').length;
        const total = list.length;
        return { i, name: monthName(i), short: monthShort(i), total, w, l, d, wr: total ? w / total : null };
      });
      const maxM = Math.max(1, ...monthly.map(m => m.total));

      const W = 720, H = 240, padL = 34, padR = 38, padT = 18, padB = 30;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const stepX = plotW / monthly.length;
      const barW = Math.min(34, stepX * 0.56);

      const gridLines = [0, 0.25, 0.5, 0.75, 1].map(frac => {
        const y = padT + plotH * (1 - frac);
        return `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#4E3626" stroke-opacity="${frac === 0 ? '0.9' : '0.14'}" stroke-width="${frac === 0 ? '2' : '1'}" stroke-dasharray="${frac === 0 ? '' : '4,4'}" />
          <text x="${padL - 7}" y="${y + 4}" text-anchor="end" fill="#745A46" font-size="11" font-weight="700">${Math.round(maxM * frac)}</text>
          <text x="${W - padR + 7}" y="${y + 4}" text-anchor="start" fill="#745A46" font-size="11" font-weight="700">${Math.round(frac * 100)}%</text>
        `;
      }).join('');

      const linePts = [];
      const barsSvg = monthly.map((m, idx) => {
        const cx = padL + stepX * idx + stepX / 2;
        const bx = cx - barW / 2;
        const hW = (m.w / maxM) * plotH;
        const hD = (m.d / maxM) * plotH;
        const hL = (m.l / maxM) * plotH;
        const yW = padT + plotH - hW;
        const yD = yW - hD;
        const yL = yD - hL;
        if (m.wr !== null) linePts.push({ x: cx, y: padT + plotH * (1 - m.wr), m });
        const tip = esc(tr(
          `<strong>${m.name} 2026</strong><br/>Partidas: ${m.total}<br/>Vitórias: ${m.w} · Derrotas: ${m.l}${m.d ? ` · Empates: ${m.d}` : ''}<br/>Win Rate: <strong>${m.wr !== null ? fmtPct(m.wr) : '—'}</strong><br/><em>Clique para filtrar</em>`,
          `<strong>${m.name} 2026</strong><br/>Matches: ${m.total}<br/>Wins: ${m.w} · Losses: ${m.l}${m.d ? ` · Draws: ${m.d}` : ''}<br/>Win Rate: <strong>${m.wr !== null ? fmtPct(m.wr) : '—'}</strong><br/><em>Click to filter</em>`
        ));
        const isSel = state.month !== 'all' && Number(state.month) === idx;
        return `
          <g class="cursor-pointer" data-click-month="${idx}" data-tip="${tip}">
            <rect x="${bx - 5}" y="${padT}" width="${barW + 10}" height="${plotH}" rx="6" fill="${isSel ? '#F1D27A' : 'transparent'}" fill-opacity="${isSel ? '0.45' : '0'}" />
            ${m.w ? `<rect x="${bx}" y="${yW}" width="${barW}" height="${hW}" rx="3" fill="#C8CF7A" stroke="#4E3626" stroke-width="1.8" />` : ''}
            ${m.d ? `<rect x="${bx}" y="${yD}" width="${barW}" height="${hD}" fill="#F1D27A" stroke="#4E3626" stroke-width="1.8" />` : ''}
            ${m.l ? `<rect x="${bx}" y="${yL}" width="${barW}" height="${hL}" rx="3" fill="#D7653A" stroke="#4E3626" stroke-width="1.8" />` : ''}

      const lineDots = linePts.map(p => {

      const podBuckets = [

      const cLinePath = cumPts.length > 1 ? `M ${cPointsStr.join(' L ')}` : '';
      const cAreaPath = cumPts.length > 1 ? `M ${cpL},${cpT + cPlotH} L ${cPointsStr.join(' L ')} L ${(cpL + cPlotW).toFixed(1)},${cpT + cPlotH} Z` : '';
      const stepHover = Math.max(1, Math.floor(cumPts.length / 45));

          <div class="nb-card p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-black">${tr('Rivais Frequentes', 'Frequent Rivals')}</h2>
              <button data-goto-tab="opponents" class="text-xs font-extrabold underline cursor-pointer">${tr('Ver todos →', 'View all →')}</button>
            </div>
            <div class="space-y-2.5">
              ${topPlayers.length ? topPlayers.map(p => `
                <button data-jump-rival="${esc(p.player)}" class="w-full text-left group cursor-pointer">
                  <div class="flex items-center justify-between text-xs gap-2 mb-1">
                    <span class="font-extrabold truncate group-hover:underline">${esc(p.player)} <span class="text-muted font-semibold">· ${p.games}${tr('j', 'g')}</span></span>
                    <span class="tabular-nums font-black ${wrClass(p.wr)}">${fmtPct(p.wr)} <span class="text-muted font-bold">(${p.w}–${p.l})</span></span>

                    <div style="width:${(p.w / maxPlayerGames * 100).toFixed(1)}%; background:#C8CF7A"></div>
                    ${p.d ? `<div style="width:${(p.d / maxPlayerGames * 100).toFixed(1)}%; background:#F1D27A"></div>` : ''}
                    <div style="width:${(p.l / maxPlayerGames * 100).toFixed(1)}%; background:#D7653A"></div>

              `).join('') : `<p class="text-xs text-muted">${tr('Nenhum jogador nomeado neste recorte.', 'No named players in this filter.')}</p>`}
            </div>
          </div>
        </div>

        <!-- Turn Duration / Game Pace Analytics -->
        ${(() => {
          const ts = calcTurnStats(filtered);
          const podTurnBuckets = [
            { label: '1v1', list: filtered.filter(m => m.pod === 2) },
            { label: '3P', list: filtered.filter(m => m.pod === 3) },
            { label: '4+P', list: filtered.filter(m => m.pod >= 4) }
          ].map(b => ({ label: b.label, stats: calcTurnStats(b.list) }));
          return `
            <div class="nb-card p-4 space-y-3">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <h2 class="text-sm font-black">${tr('Ritmo das Mesas (Duração em Turnos)', 'Game Pace (Turn Duration)')}</h2>
                    <span class="px-2 py-0.5 rounded text-xs ${ts.count ? 'badge-pop-yellow' : 'badge-neutral'}">${ts.count ? tr(`${ts.count} ${ts.count === 1 ? 'jogo' : 'jogos'} com turnos`, `${ts.count} ${ts.count === 1 ? 'game' : 'games'} with turns`) : tr('Pronto para novas partidas', 'Ready for new matches')}</span>
                  </div>
                  <p class="text-xs font-medium text-muted mt-0.5">${tr('Velocidade média das partidas — ideal para comparar vitórias rápidas, mesas longas e ritmo por deck', 'Average match speed — ideal for comparing fast wins, long pods, and deck tempo')}</p>
                </div>
                ${ts.count === 0 ? `<button data-goto-tab="report" class="nb-btn nb-btn-yellow px-3 py-1.5 text-xs shrink-0">${tr('+ Reportar com turnos', '+ Report with turns')}</button>` : ''}
              </div>

              <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="nb-subtle p-3" data-tip="${esc(tr('Duração média em turnos de todas as partidas que possuem registro de turnos neste recorte.', 'Average turn duration across all matches with turn counts recorded in this filter.'))}">
                  <div class="text-xs font-bold text-muted">${tr('Média Geral', 'Overall Avg')}</div>
                  <div class="text-xl font-black tabular-nums mt-0.5">${fmtTurns(ts.avg)}</div>
                  <div class="text-xs font-semibold text-muted">${ts.count ? tr(`em ${ts.count} partida(s)`, `across ${ts.count} game(s)`) : tr('aguardando 1º registro', 'awaiting 1st entry')}</div>
                </div>
                <div class="nb-subtle p-3" data-tip="${esc(tr('Em quantos turnos, em média, você fecha o jogo quando vence.', 'Average turn on which you close out the game when winning.'))}">
                  <div class="text-xs font-bold text-muted">${tr('Nas Vitórias', 'In Wins')}</div>
                  <div class="text-xl font-black tabular-nums mt-0.5 ${ts.avgWin !== null ? 'wr-high' : ''}">${fmtTurns(ts.avgWin)}</div>
                  <div class="text-xs font-semibold text-muted">${ts.winCount ? tr(`${ts.winCount} vitória(s)`, `${ts.winCount} win(s)`) : tr('sem dados ainda', 'no data yet')}</div>
                </div>
                <div class="nb-subtle p-3" data-tip="${esc(tr('Em quantos turnos, em média, a mesa termina quando você é derrotado.', 'Average turn on which the pod ends when you lose.'))}">
                  <div class="text-xs font-bold text-muted">${tr('Nas Derrotas', 'In Losses')}</div>
                  <div class="text-xl font-black tabular-nums mt-0.5 ${ts.avgLoss !== null ? 'wr-low' : ''}">${fmtTurns(ts.avgLoss)}</div>
                  <div class="text-xs font-semibold text-muted">${ts.lossCount ? tr(`${ts.lossCount} derrota(s)`, `${ts.lossCount} loss(es)`) : tr('sem dados ainda', 'no data yet')}</div>
                </div>

              ${ts.count ? `

                      <span class="font-extrabold">${tr('Mesa', 'Pod')} ${b.label}</span>
                      <span class="font-black tabular-nums">${fmtTurns(b.stats.avg)} <span class="text-muted font-semibold">(${b.stats.count}${tr('j', 'g')})</span></span>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="nb-subtle px-3.5 py-2.5 text-xs font-medium text-muted">
                  ${tr('Nenhuma partida anterior possui registro de turnos ainda — basta preencher o campo <strong>Duração (Turnos)</strong> na aba <strong>+ Reportar</strong> (ou informar no chat) a partir das próximas mesas para estes indicadores preencherem automaticamente.', 'No past matches have turn counts recorded yet — fill in <strong>Game Duration (Turns)</strong> in the <strong>+ Report</strong> tab on your upcoming games to populate these metrics automatically.')}
                </div>
              `}
            </div>
          `;
        })()}
      `;
    }

    function renderDeckTrajectoryChart(dm, meta, acc) {
      if (!dm.length) return '';
      const W = 360, H = 148, pL = 34, pR = 14, pT = 18, pB = 26;
      const plotW = W - pL - pR, plotH = H - pT - pB;

      const ordered = dm.slice().sort((a, b) => {
        const ka = a.date || `${a.year || '2026'}-${String(a.monthIdx + 1).padStart(2, '0')}-00`;
        const kb = b.date || `${b.year || '2026'}-${String(b.monthIdx + 1).padStart(2, '0')}-00`;
        if (ka !== kb) return ka.localeCompare(kb);
        return a.n - b.n;
      });

      let wins = 0;
      const pts = ordered.map((m, idx) => {
        if (m.res === 'V') wins++;
        const wr = wins / (idx + 1);
        const x = ordered.length === 1 ? pL + plotW / 2 : pL + (idx / (ordered.length - 1)) * plotW;
        const y = pT + plotH * (1 - wr);
        return { m, idx, wr, x, y };
      });

      const linePath = pts.length > 1 ? pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ') : '';
      const areaPath = pts.length > 1 ? `${linePath} L${pts[pts.length - 1].x.toFixed(1)},${(pT + plotH).toFixed(1)} L${pts[0].x.toFixed(1)},${(pT + plotH).toFixed(1)} Z` : '';

      let updateMarkerSvg = '';
      let beforeAfterHtml = '';
      const updIso = meta && meta.lastUpdated ? meta.lastUpdated : '';
      if (updIso) {
        const isAfterUpdate = m => {
          if (m.date) return m.date >= updIso;
          const mYM = `${m.year || '2026'}-${String(m.monthIdx + 1).padStart(2, '0')}`;
          return mYM > updIso.slice(0, 7);
        };
        let splitIdx = ordered.findIndex(isAfterUpdate);
        if (splitIdx === -1) splitIdx = ordered.length;

        let markerX = W - pR;
        if (splitIdx === 0) markerX = pL;
        else if (splitIdx < ordered.length) markerX = (pts[splitIdx - 1].x + pts[splitIdx].x) / 2;

        const shortU = fmtShortDateBr(updIso);
        const labelAnchor = markerX > W - 64 ? 'end' : (markerX < pL + 54 ? 'start' : 'middle');
        const labelX = labelAnchor === 'end' ? markerX - 3 : (labelAnchor === 'start' ? markerX + 3 : markerX);
        const markerTip = esc(tr(
          `<strong>Última mudança na decklist: ${fmtDateDisp(updIso)}</strong>${meta.note ? `<br/>${meta.note}` : ''}`,
          `<strong>Last decklist update: ${fmtDateDisp(updIso)}</strong>${meta.note ? `<br/>${meta.note}` : ''}`
        ));
        updateMarkerSvg = `
          <g data-tip="${markerTip}">
            <line x1="${markerX.toFixed(1)}" y1="${pT - 2}" x2="${markerX.toFixed(1)}" y2="${pT + plotH}" stroke="#D7653A" stroke-width="1.8" stroke-dasharray="4,3" />
            <circle cx="${markerX.toFixed(1)}" cy="${pT - 2}" r="3" fill="#D7653A" stroke="#4E3626" stroke-width="1" />
            <text x="${labelX.toFixed(1)}" y="${pT - 6}" text-anchor="${labelAnchor}" fill="#D7653A" font-size="9.5" font-weight="900">Update ${shortU}</text>
          </g>
        `;

        const beforeList = ordered.slice(0, splitIdx);
        const afterList = ordered.slice(splitIdx);
        if (beforeList.length && afterList.length) {
          const bWr = beforeList.filter(x => x.res === 'V').length / beforeList.length;
          const aWr = afterList.filter(x => x.res === 'V').length / afterList.length;
          const diff = (aWr - bWr) * 100;
          beforeAfterHtml = `
            <div class="flex items-center justify-between gap-2 text-xs nb-subtle px-2.5 py-1.5 flex-wrap" data-tip="${esc(tr(`Comparativo de aproveitamento antes e depois da mudança na decklist em ${fmtDateDisp(updIso)}.`, `Win rate comparison before and after the decklist update on ${fmtDateDisp(updIso)}.`))}">

              <span class="px-1.5 py-0.2 rounded text-xs ${diff >= 0 ? 'badge-win' : 'badge-loss'} tabular-nums">${diff >= 0 ? '+' : ''}${diff.toFixed(0)} pp</span>

          `;
        } else if (beforeList.length && !afterList.length) {
          beforeAfterHtml = `
            <div class="text-xs font-semibold text-muted nb-subtle px-2.5 py-1.5" data-tip="${esc(tr('A linha tracejada à direita marca a última mudança na decklist. Novas partidas com data a partir deste dia aparecerão depois da linha.', 'The dashed line on the right marks the latest decklist update. New dated games from this day onward will appear after the line.'))}">
              ${tr(`Decklist atualizada em <strong>${fmtDateDisp(updIso)}</strong> · aguardando 1º jogo pós-mudança.`, `Decklist updated on <strong>${fmtDateDisp(updIso)}</strong> · awaiting 1st post-update game.`)}
            </div>
          `;
        }
      }

      const dotR = ordered.length > 18 ? 3.2 : 4;
      const dotsSvg = pts.map(p => {
        const fill = p.m.res === 'V' ? '#C8CF7A' : (p.m.res === 'D' ? '#D7653A' : '#F1D27A');
        const tip = esc(tr(
          `<strong>#${p.idx + 1} · ${p.m.id}</strong> (${matchDateLabel(p.m)})<br/>Resultado: <strong>${resLabelOf(p.m.res)}</strong> · Mesa ${p.m.pod}P${p.m.turns ? ` · ${p.m.turns}t` : ''}<br/>WR acumulado: <strong>${fmtPct(p.wr)}</strong>`,
          `<strong>#${p.idx + 1} · ${p.m.id}</strong> (${matchDateLabel(p.m)})<br/>Result: <strong>${resLabelOf(p.m.res)}</strong> · Pod ${p.m.pod}P${p.m.turns ? ` · ${p.m.turns}t` : ''}<br/>Cumulative WR: <strong>${fmtPct(p.wr)}</strong>`
        ));
        return `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${dotR}" fill="${fill}" stroke="#4E3626" stroke-width="1.4" class="cursor-pointer" data-tip="${tip}" />`;
      }).join('');

      const firstLbl = matchDateLabel(ordered[0]);
      const lastLbl = matchDateLabel(ordered[ordered.length - 1]);
      const midPt = ordered.length >= 4 ? pts[Math.floor((ordered.length - 1) / 2)] : null;

      return `
        <div class="space-y-1.5">
          <div class="flex items-center justify-between gap-2">
            <div class="text-xs font-extrabold" data-tip="${esc(tr('Evolução cronológica do Win Rate acumulado deste deck partida a partida. Pontos azuis = Vitória, vermelhos = Derrota, amarelos = Empate.', 'Chronological cumulative Win Rate trajectory match by match. Blue dots = Win, red = Loss, yellow = Draw.'))}">${tr('Trajetória de Performance', 'Performance Trajectory')}</div>
            <span class="text-xs font-semibold text-muted tabular-nums">${ordered.length} ${tr(ordered.length === 1 ? 'jogo' : 'jogos', ordered.length === 1 ? 'game' : 'games')}</span>

                const y = pT + plotH * (1 - f);

                  <line x1="${pL}" y1="${y.toFixed(1)}" x2="${W - pR}" y2="${y.toFixed(1)}" stroke="#4E3626" stroke-opacity="${f === 0.5 ? '0.45' : '0.14'}" stroke-width="${f === 0.5 ? '1.3' : '1'}" stroke-dasharray="${f === 0.5 ? '4,4' : '2,3'}" />

    // =========================================================================
    // TAB 2: DECKS (FOLDER COLLECTION + TABLE + X-RAY + SCATTER)
    // =========================================================================
    function renderDecks(filtered) {
      if (!filtered.length) return renderEmptyState();

      let decks = groupDecks(filtered);
      if (state.deckSearch.trim()) {
        const q = state.deckSearch.trim().toLowerCase();
        decks = decks.filter(d => d.deck.toLowerCase().includes(q));
      }
      const visibleDecks = decks.filter(d => d.games >= state.deckMinGames);

      visibleDecks.sort((a, b) => {
        if (state.deckSort === 'weighted') return (b.wilson - a.wilson) || (b.games - a.games);
        if (state.deckSort === 'fav') {
          const fa = isFavDeck(a.deck) ? 1 : 0, fb = isFavDeck(b.deck) ? 1 : 0;
          if (fb !== fa) return fb - fa;
          return (b.games - a.games) || (b.wr - a.wr);
        }
        if (state.deckSort === 'wr') {
          const qa = a.games >= 5 ? 1 : 0, qb = b.games >= 5 ? 1 : 0;
          if (qb !== qa) return qb - qa;
          return (b.wr - a.wr) || (b.games - a.games);
        }
        if (state.deckSort === 'wins') return (b.w - a.w) || (b.wr - a.wr);
        if (state.deckSort === 'name') return a.deck.localeCompare(b.deck, 'pt-BR');
        return (b.games - a.games) || (b.wr - a.wr);
      });

      const splitHonorable = state.deckSort === 'wr' && visibleDecks.some(d => d.games >= 5) && visibleDecks.some(d => d.games < 5);
      const mainDecks = splitHonorable ? visibleDecks.filter(d => d.games >= 5) : visibleDecks;
      const honorableDecks = splitHonorable ? visibleDecks.filter(d => d.games < 5) : [];
      const showWeighted = state.deckSort === 'weighted';

      const activeDeckObj = visibleDecks.find(d => d.deck === state.selectedDeck) || mainDecks[0] || visibleDecks[0] || null;

      // Scatter SVG
      const SW = 620, SH = 230, spL = 42, spR = 24, spT = 18, spB = 34;
      const sPlotW = SW - spL - spR, sPlotH = SH - spT - spB;
      const maxG = Math.max(5, ...visibleDecks.map(d => d.games));
      const xMax = Math.ceil((maxG + 2) / 5) * 5;
      const xTicks = [];
      for (let v = 0; v <= xMax; v += (xMax <= 10 ? 2 : 5)) xTicks.push(v);

      const bubbles = visibleDecks.map(d => {
        const cx = spL + (d.games / xMax) * sPlotW;

        const isSel = activeDeckObj && activeDeckObj.deck === d.deck;

        ));
        return `
          <g class="cursor-pointer" data-select-deck="${esc(d.deck)}" data-tip="${tip}">
            <circle cx="${(cx + 2).toFixed(1)}" cy="${(cy + 2).toFixed(1)}" r="${r.toFixed(1)}" fill="#4E3626" />
            <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${wrBarColor(d.wr)}" stroke="#4E3626" stroke-width="${isSel ? '3' : '2'}" />
            ${d.games >= 8 || isSel ? `<text x="${cx.toFixed(1)}" y="${(cy - r - 5).toFixed(1)}" text-anchor="middle" fill="#4E3626" font-size="10.5" font-weight="800">${esc(shortDeck(d.deck, 14))}</text>` : ''}
          </g>
        `;
      }).join('');

      let xrayHtml = '';
      if (activeDeckObj) {
        const dm = activeDeckObj.matches;
        const ds = calcStats(dm);
        const acc = deckAccent(activeDeckObj);
        const activeBadges = getDeckBadges(activeDeckObj, { honorable: activeDeckObj.games < 5 });
        const dPlayers = groupPlayers(dm).sort((a, b) => b.games - a.games).slice(0, 6);

                </div>

              <!-- Commander(s) Display, Mana Color Identity & Partner Toggle Editor -->

                  </div>
                </div>

                ${!state.showDeckCmdEditor ? `
                  <div class="space-y-1.5">
                    <a href="${esc(scryfallCardUrl(cmdInfo.cmd1))}" target="_blank" rel="noopener noreferrer"
                      data-tip="${esc(tr(`Abrir "${cmdInfo.cmd1}" no Scryfall (nova aba).`, `View "${cmdInfo.cmd1}" on Scryfall (new tab).`))}"
                      class="group flex items-center justify-between gap-2 text-xs bg-[#FCF8F0] hover:bg-[#F3ECE0] border-[1.5px] border-[#4E3626] rounded-lg px-2.5 py-1.5 no-underline text-[#4E3626] transition-colors">
                      <span class="flex items-center gap-2 min-w-0">
                        <span class="w-5 h-5 rounded-md badge-pop-yellow inline-flex items-center justify-center font-black shrink-0">${cmdInfo.partner ? '1' : '★'}</span>

                      <span class="text-xs font-bold text-muted group-hover:text-[#4E3626] shrink-0 inline-flex items-center gap-0.5">Scryfall ↗</span>

                      ${(cmdInfo.isCustom || dMeta.colorsCustom) ? `<button type="button" data-reset-deck-cmd="${esc(activeDeckObj.deck)}" class="text-xs font-extrabold underline cursor-pointer">${tr('Restaurar padrão', 'Reset default')}</button>` : '<span></span>'}
                      <div class="flex items-center gap-1.5">

                        <span>${tr('Abrir Decklist', 'Open Decklist')}</span>

                    ` : `

                        class="nb-btn px-3 py-1.5 text-xs inline-flex items-center gap-1.5">

                      class="nb-pill px-2.5 py-1.5 text-xs inline-flex items-center gap-1 ${state.showDeckMetaEditor ? 'nb-pill-active' : ''}">

    function getRivalCommanders(matches, playerName) {
      const aliases = playerName === 'Josué' ? ['josué', 'josu']
        : playerName === 'Mateus' ? ['mateus', 'matheus']
        : playerName === 'Rafael' ? ['rafael', 'rafa']
        : [playerName.toLowerCase()];
      const map = new Map();
      for (const m of matches) {
        const chunks = m.oppStr.split(/\)\s*(?:,\s*|\s+e\s+)/);
        let foundCmd = '';
        for (const rawCh of chunks) {
          const ch = rawCh.trim();
          const pMatch = ch.match(/\(([^)]+)\)?\s*$/);
          if (!pMatch) continue;
          const inside = pMatch[1].toLowerCase().replace(/\s*-\s*vencedor.*$/, '').replace(/\s*-\s*rio.*$/, '').trim();
          const parts = inside.split(/\/\/|\//).map(x => x.trim());
          if (parts.some(pt => aliases.includes(pt))) {
            foundCmd = ch.slice(0, pMatch.index).replace(/^[,.\s]+|[,.\s]+$/g, '');
            break;
          }
        }
        if (foundCmd) {
          // Resolve against canonical full enemy commander name in m.enemyCmds
          const fLow = foundCmd.toLowerCase().replace(/[^a-z0-9]/g, '');
          const canonical = (m.enemyCmds || []).find(ec => {
            const eLow = ec.toLowerCase().replace(/[^a-z0-9]/g, '');
            return eLow === fLow || eLow.startsWith(fLow) || fLow.startsWith(eLow);
          }) || foundCmd;
          if (!map.has(canonical)) map.set(canonical, { cmd: canonical, games: 0, w: 0, l: 0, d: 0 });
          const g = map.get(canonical);
          g.games++;
          if (m.res === 'V') g.w++;
          else if (m.res === 'D') g.l++;
          else g.d++;
        }
      }
      return Array.from(map.values()).sort((a, b) => b.games - a.games);
    }
